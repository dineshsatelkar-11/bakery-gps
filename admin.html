<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Baked — Admin</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a2f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baked GPS">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5ede0;color:#1e1611;max-width:520px;margin:0 auto;min-height:100vh}
.topbar{background:#4a2f14;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99}
.topbar-title{color:#fff;font-size:15px;font-weight:800}
.topbar-sub{color:#c8a87a;font-size:11px;font-family:monospace}
.topbar-right{display:flex;gap:8px}
.tbtn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 11px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:-apple-system,sans-serif;text-decoration:none;display:inline-block}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e8dfd2;position:sticky;top:53px;z-index:98;overflow-x:auto}
.tab{flex:1;min-width:70px;padding:11px 4px;border:none;background:none;font-size:11px;font-weight:700;cursor:pointer;color:#8a7a6a;font-family:-apple-system,sans-serif;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:#4a2f14;border-bottom-color:#4a2f14}
.page{display:none;padding:12px 14px 80px}.page.on{display:block}
.card{background:#fff;border:1.5px solid #e8dfd2;border-radius:16px;padding:14px;margin-bottom:10px}
.lbl{font-size:10px;letter-spacing:2px;color:#8a7a6a;font-family:monospace;font-weight:700;margin-bottom:8px;text-transform:uppercase}
select,input[type=text],input[type=date]{width:100%;padding:11px 14px;border:1.5px solid #e8dfd2;border-radius:10px;font-size:14px;color:#1e1611;background:#f5ede0;outline:none;-webkit-appearance:none;font-family:-apple-system,sans-serif;margin-bottom:8px}
.btn{width:100%;padding:13px;border:none;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;font-family:-apple-system,sans-serif;margin-bottom:8px}
.btn-parse{background:#2d7a4f;color:#fff}
.btn-refresh{background:#e8dfd2;color:#4a2f14}
.btn-sm{padding:7px 11px;border-radius:10px;font-size:11px;font-weight:700;border:none;cursor:pointer;font-family:-apple-system,sans-serif}
.btn-del{background:#fde8e8;color:#c8382a}
.btn-map{background:#e3f2fd;color:#1565c0}
.btn-csv{background:#e8f5e9;color:#2d7a4f;width:100%;padding:12px;border-radius:12px;font-size:14px;font-weight:800;border:none;cursor:pointer;font-family:-apple-system,sans-serif;margin-bottom:10px}
.msg{padding:11px 14px;border-radius:12px;font-size:12px;font-weight:600;font-family:monospace;margin-bottom:10px;line-height:1.8;white-space:pre-line}
.ok{background:#e8f5e9;color:#2d7a4f;border:1px solid #a5d6a7}
.er{background:#fde8e8;color:#c8382a;border:1px solid #f0b0b0}
.summary-card{background:#fff;border:1.5px solid #e8dfd2;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.summary-row{font-size:12px;font-family:monospace;padding:3px 0;border-bottom:1px solid #f0e8dc}
.order-card{background:#fff;border:1.5px solid #e8dfd2;border-radius:14px;padding:11px 14px;margin-bottom:8px}
.deliv-row{background:#fff;border:1.5px solid #e8dfd2;border-radius:12px;padding:10px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1.5px solid #e8dfd2;border-radius:12px;padding:10px;text-align:center}
.stat-n{font-size:20px;font-weight:900;color:#4a2f14}
.stat-l{font-size:9px;color:#8a7a6a;font-family:monospace}
.driver-card{background:#fff;border:1.5px solid #e8dfd2;border-radius:14px;padding:13px;margin-bottom:10px}
.route-mini{font-size:11px;font-family:monospace;padding:3px 0;border-bottom:1px solid #f0e8dc}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;font-family:monospace}
.b-ok{background:#e8f5e9;color:#2d7a4f}.b-warn{background:#fff8e1;color:#7a4800}
.b-miss{background:#fde8e8;color:#c8382a}.b-done{background:#e8f5e9;color:#2d7a4f}
.filter-row{display:flex;gap:8px;margin-bottom:8px}
.filter-row select,.filter-row input{margin-bottom:0}
.DC-Bharat{background:#fff3e0;color:#c8864a}.DC-Anand{background:#e3f2fd;color:#1a5fa8}
.DC-Vikas{background:#e8f5e9;color:#2d7a4f}.DC-Yuvraj{background:#f3e8ff;color:#6e3da8}
.DC-Rama{background:#fde8e8;color:#c8382a}.DC-Dinesh{background:#fce4ec;color:#880e4f}

/* XLS Upload */
.upload-zone{border:2.5px dashed #c8a87a;border-radius:16px;padding:28px 14px;text-align:center;background:#fffdf9;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:10px;position:relative}
.upload-zone:hover,.upload-zone.drag{border-color:#4a2f14;background:#f5ede0}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{font-size:32px;margin-bottom:6px}
.upload-title{font-size:14px;font-weight:800;color:#4a2f14;margin-bottom:4px}
.upload-sub{font-size:11px;color:#8a7a6a;font-family:monospace}
.challan-card{background:#fff;border:1.5px solid #e8dfd2;border-radius:14px;padding:13px 14px;margin-bottom:10px}
.challan-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0;cursor:pointer;user-select:none}
.challan-title{font-size:14px;font-weight:800;color:#4a2f14}
.challan-meta{font-size:10px;color:#8a7a6a;font-family:monospace;margin-top:3px}
.challan-items{margin-top:10px}
.challan-item-row{display:grid;grid-template-columns:1fr auto;gap:6px;padding:7px 0;border-bottom:1px solid #f0e8dc}
.challan-item-row:last-child{border-bottom:none}
.item-name{color:#1e1611;font-weight:700;font-size:12px}
.item-pid{color:#8a7a6a;font-size:10px;font-family:monospace}
.item-desc{color:#8a7a6a;font-size:10px;font-style:italic}
.item-qty{font-size:15px;font-weight:900;color:#4a2f14;text-align:right}
.item-qty-lbl{font-size:9px;color:#8a7a6a;text-align:right;font-family:monospace;letter-spacing:1px}
.challan-collapsed .challan-items{display:none}
.xls-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.xls-stat{background:#fff;border:1.5px solid #e8dfd2;border-radius:12px;padding:10px;text-align:center}
.search-box{background:#fff;border:1.5px solid #e8dfd2;border-radius:10px;padding:10px 14px;font-size:13px;color:#1e1611;outline:none;width:100%;margin-bottom:8px;font-family:-apple-system,sans-serif}
</style>
</head>
<body>

<div class="topbar">
  <div><div class="topbar-title">Baked Admin</div><div class="topbar-sub" id="topDate"></div></div>
  <div class="topbar-right">
    <a href="shops.html" class="tbtn">Shops</a>
    <button class="tbtn" id="logoutBtn">Logout</button>
  </div>
</div>

<div class="tabs">
  <button class="tab on" id="tb-orders"   onclick="showTab('orders')">Orders</button>
  <button class="tab"    id="tb-summary"  onclick="showTab('summary')">Summary</button>
  <button class="tab"    id="tb-delivery" onclick="showTab('delivery')">Delivery</button>
  <button class="tab"    id="tb-routes"   onclick="showTab('routes')">Routes</button>
  <button class="tab"    id="tb-gps"      onclick="showTab('gps')">GPS</button>
</div>

<!-- ORDERS — XLS Upload (no WhatsApp chat) -->
<div class="page on" id="pg-orders">

  <div class="card">
    <div class="lbl">Import Delivery Challan</div>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="xlsFile" accept=".xls,.xlsx,.csv">
      <div class="upload-icon">📂</div>
      <div class="upload-title">Tap to choose file</div>
      <div class="upload-sub">Supports .xls · .xlsx · .csv</div>
    </div>
    <div id="xls-file-name" style="display:none;font-size:12px;font-family:monospace;color:#4a2f14;background:#f5ede0;padding:8px 12px;border-radius:8px;margin-bottom:8px"></div>
    <div id="xls-msg" style="display:none" class="msg ok"></div>
    <button class="btn btn-parse" id="parseXlsBtn" style="display:none">Parse Challan</button>
  </div>

  <div id="xlsStatsBox" style="display:none">
    <div class="xls-stats-grid" id="xlsStats"></div>
  </div>

  <div id="xlsPreviewBox" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-size:13px;font-weight:800;color:#4a2f14" id="xlsPreviewTitle"></div>
      <div style="display:flex;gap:6px">
        <button class="btn-sm" style="background:#f5ede0;color:#4a2f14" id="xlsToggleBtn" onclick="toggleXlsAll()">Collapse All</button>
        <button class="btn-sm" style="background:#e8f5e9;color:#2d7a4f" id="xlsExportBtn">Export CSV</button>
      </div>
    </div>
    <input class="search-box" id="xlsSearch" placeholder="Search customer / item..." oninput="renderXlsChallans()">
    <div id="xlsChallanList"></div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px">

    <button class="btn-sm btn-refresh" id="refreshOrdersBtn">Refresh</button>

<!-- SUMMARY -->
<div class="page" id="pg-summary">
  <div class="filter-row"><input type="date" id="f-sum-date" style="margin-bottom:0"></div>
  <button class="btn btn-refresh" id="refreshSumBtn">Refresh</button>

</div>

<!-- DELIVERY -->
<div class="page" id="pg-delivery">
  <div class="stats-grid" id="delivStats"></div>
  <div class="filter-row">
    <select id="f-del-driver"><option value="">All</option><option>Bharat</option><option>Anand</option><option>Vikas</option><option>Yuvraj</option><option>Rama</option></select>

  </div>
  <button class="btn btn-refresh" id="refreshDelBtn">Refresh</button>

<!-- ROUTES -->
<div class="page" id="pg-routes">
  <div class="stats-grid" id="routeStats"></div>
  <div class="filter-row">
    <select id="f-rt-driver"><option value="">All</option><option>Bharat</option><option>Anand</option><option>Vikas</option><option>Yuvraj</option><option>Rama</option></select>
    <input type="date" id="f-rt-date" style="margin-bottom:0">
  </div>

<!-- GPS -->
<div class="page" id="pg-gps">
  <div class="stats-grid" id="gpsStats"></div>
  <div class="filter-row">
    <select id="f-gps-driver"><option value="">All</option><option>Bharat</option><option>Anand</option><option>Vikas</option><option>Yuvraj</option><option>Rama</option><option>Dinesh</option></select>
    <select id="f-gps-status"><option value="">All</option><option value="saved">Saved</option><option value="missing">Missing</option></select>

<!-- SheetJS CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
var SHEET_API = 'https://script.google.com/macros/s/AKfycbyi-IJ6NLR28hRTeesy52THTbdcYCSnz3lp7NtEaJsxBOiNOm-9emMu0xOHT6hvWSE-/exec';

if(sessionStorage.getItem('role') !== 'admin') window.location.href = 'index.html';

function api(p){ return fetch(SHEET_API+'?'+new URLSearchParams(p)).then(function(r){return r.json();}).catch(function(){return [];}); }
function apiPost(b){ return fetch(SHEET_API,{method:'POST',body:JSON.stringify(b)}).then(function(r){return r.json();}).catch(function(){return {};}); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+zp(d.getMonth()+1)+'-'+zp(d.getDate()); }
function zp(n){ return String(n).padStart(2,'0'); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('topDate').textContent = new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'});
['f-ord-date','f-rt-date','f-sum-date','f-del-date'].forEach(function(id){ document.getElementById(id).value = todayStr(); });

// ── BUTTON EVENTS ──
document.getElementById('logoutBtn').onclick        = function(){ sessionStorage.clear(); window.location.href='index.html'; };
document.getElementById('parseXlsBtn').onclick      = parseXlsFile;
document.getElementById('xlsExportBtn').onclick     = exportXlsCSV;
document.getElementById('refreshOrdersBtn').onclick = loadOrders;
document.getElementById('refreshSumBtn').onclick    = loadSummary;
document.getElementById('refreshDelBtn').onclick    = loadDeliveries;
document.getElementById('refreshRtBtn').onclick     = loadRoutes;
document.getElementById('exportRtBtn').onclick      = exportRouteCSV;
document.getElementById('exportGpsBtn').onclick     = exportGPSCSV;
document.getElementById('f-ord-driver').onchange    = loadOrders;
document.getElementById('f-ord-date').onchange      = loadOrders;
document.getElementById('f-sum-date').onchange      = loadSummary;
document.getElementById('f-del-driver').onchange    = loadDeliveries;
document.getElementById('f-del-date').onchange      = loadDeliveries;
document.getElementById('f-rt-driver').onchange     = loadRoutes;
document.getElementById('f-rt-date').onchange       = loadRoutes;
document.getElementById('f-gps-driver').onchange    = renderGPS;
document.getElementById('f-gps-status').onchange    = renderGPS;

// ── XLS UPLOAD ──
var xlsData    = [];   // grouped challan objects
var xlsRawRows = [];   // flat extracted rows

var xlsInput   = document.getElementById('xlsFile');
var uploadZone = document.getElementById('uploadZone');

xlsInput.addEventListener('change', function(){
  if(!this.files || !this.files[0]) return;
  var f = this.files[0];
  document.getElementById('xls-file-name').textContent = '📄 ' + f.name + '  (' + (f.size/1024).toFixed(1) + ' KB)';
  document.getElementById('xls-file-name').style.display = 'block';
  document.getElementById('parseXlsBtn').style.display   = 'block';
  document.getElementById('xls-msg').style.display       = 'none';
});

uploadZone.addEventListener('dragover',  function(e){ e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', function(){ uploadZone.classList.remove('drag'); });
uploadZone.addEventListener('drop', function(e){
  e.preventDefault(); uploadZone.classList.remove('drag');
  if(e.dataTransfer.files[0]){
    xlsInput.files = e.dataTransfer.files;
    xlsInput.dispatchEvent(new Event('change'));
  }
});

// Required columns mapped to internal keys
var COL_MAP = {
  'Challan Date':    'challan_date',
  'Customer ID':     'customer_id',
  'Customer Name':   'customer_name',
  'Item Name':       'item_name',
  'Product ID':      'product_id',
  'Item Desc':       'item_desc',
  'QuantityOrdered': 'qty'
};

function parseXlsFile(){
  var file = xlsInput.files[0];
  if(!file){ showMsg('No file selected.','er'); return; }
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var wb   = XLSX.read(e.target.result, {type:'array', cellDates:true});
      var ws   = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {defval:''});

      if(!rows.length){ showMsg('File is empty or unreadable.','er'); return; }

      // Check required columns exist
      var firstRow = rows[0];
      var missing  = Object.keys(COL_MAP).filter(function(c){ return !(c in firstRow); });
      if(missing.length){
        showMsg('Missing columns:\n' + missing.join(', '), 'er');
        return;
      }

      // Extract required fields only
      xlsRawRows = rows.map(function(row){
        var r = {};
        Object.keys(COL_MAP).forEach(function(col){ r[COL_MAP[col]] = String(row[col]||'').trim(); });
        return r;
      }).filter(function(r){ return r.customer_name && r.item_name; });

      if(!xlsRawRows.length){ showMsg('No valid data rows found.','er'); return; }

      // Group rows by customer (customer_id + challan_date)
      var grouped = {};
      xlsRawRows.forEach(function(r){
        var key = r.customer_id + '||' + r.challan_date;
        if(!grouped[key]) grouped[key] = {
          challan_date:  r.challan_date,
          customer_id:   r.customer_id,
          customer_name: r.customer_name,
          items: []
        };
        grouped[key].items.push({
          item_name:  r.item_name,
          product_id: r.product_id,
          item_desc:  r.item_desc,
          qty:        r.qty
        });
      });
      xlsData = Object.values(grouped);

      var totalQty = xlsRawRows.reduce(function(s,r){ return s+(parseInt(r.qty)||0); }, 0);

      // Stats
      document.getElementById('xlsStatsBox').style.display = 'block';
      document.getElementById('xlsStats').innerHTML =
        '<div class="xls-stat"><div class="stat-n">'+xlsData.length+'</div><div class="stat-l">Customers</div></div>'+
        '<div class="xls-stat"><div class="stat-n">'+xlsRawRows.length+'</div><div class="stat-l">Line Items</div></div>'+
        '<div class="xls-stat"><div class="stat-n">'+totalQty+'</div><div class="stat-l">Total Qty</div></div>';

      // Preview
      document.getElementById('xlsPreviewBox').style.display = 'block';
      document.getElementById('xlsPreviewTitle').textContent = 'Delivery Challan — ' + xlsData.length + ' customers';
      document.getElementById('xlsSearch').value = '';
      renderXlsChallans();
      showMsg('Parsed ' + xlsData.length + ' customers · ' + xlsRawRows.length + ' line items · ' + totalQty + ' total qty.', 'ok');

    } catch(err){
      showMsg('Parse error: ' + err.message, 'er');
    }
  };
  reader.readAsArrayBuffer(file);
}

function showMsg(txt, cls){
  var el = document.getElementById('xls-msg');
  el.textContent = txt; el.className = 'msg ' + cls; el.style.display = 'block';
}

// ── RENDER CHALLANS ──
var xlsAllCollapsed = false;

function toggleXlsAll(){
  xlsAllCollapsed = !xlsAllCollapsed;
  document.getElementById('xlsToggleBtn').textContent = xlsAllCollapsed ? 'Expand All' : 'Collapse All';
  document.querySelectorAll('.challan-card').forEach(function(el){
    el.classList.toggle('challan-collapsed', xlsAllCollapsed);
  });
}

function renderXlsChallans(){
  var q = (document.getElementById('xlsSearch').value || '').toLowerCase().trim();
  var list = xlsData.filter(function(c){
    if(!q) return true;
    if(c.customer_name.toLowerCase().indexOf(q) >= 0) return true;
    if(c.customer_id.toLowerCase().indexOf(q) >= 0) return true;
    return c.items.some(function(it){ return it.item_name.toLowerCase().indexOf(q) >= 0; });
  });

  if(!list.length){
    document.getElementById('xlsChallanList').innerHTML =
      '<div style="text-align:center;padding:24px;font-size:13px;color:#8a7a6a;font-family:monospace">No results.</div>';
    return;
  }

  document.getElementById('xlsChallanList').innerHTML = list.map(function(c, i){
    var itemsHtml = c.items.map(function(it){
      return '<div class="challan-item-row">'+
        '<div>'+
          '<div class="item-name">'+esc(it.item_name)+'</div>'+
          (it.item_desc ? '<div class="item-desc">'+esc(it.item_desc)+'</div>' : '')+
          '<div class="item-pid">Product ID: '+esc(it.product_id)+'</div>'+
        '</div>'+
        '<div>'+
          '<div class="item-qty">'+esc(it.qty)+'</div>'+
          '<div class="item-qty-lbl">QTY</div>'+
        '</div>'+
      '</div>';
    }).join('');

    return '<div class="challan-card" id="cc-'+i+'">'+
      '<div class="challan-header" onclick="document.getElementById(\'cc-'+i+'\').classList.toggle(\'challan-collapsed\')">'+
        '<div>'+
          '<div class="challan-title">'+esc(c.customer_name)+'</div>'+
          '<div class="challan-meta">'+esc(c.customer_id)+' &nbsp;·&nbsp; '+esc(c.challan_date)+' &nbsp;·&nbsp; '+c.items.length+' item'+(c.items.length!==1?'s':'')+'</div>'+
        '</div>'+
        '<span style="font-size:20px;color:#c8a87a;margin-left:8px">⌄</span>'+
      '</div>'+
      '<div class="challan-items">'+itemsHtml+'</div>'+
    '</div>';
  }).join('');
}

function exportXlsCSV(){
  if(!xlsRawRows.length){ alert('No data to export.'); return; }
  var rows = [['Challan Date','Customer ID','Customer Name','Item Name','Product ID','Item Desc','QuantityOrdered']];
  xlsRawRows.forEach(function(r){
    rows.push([r.challan_date, r.customer_id, r.customer_name, r.item_name, r.product_id, r.item_desc, r.qty]);
  });
  dlCSV(rows, 'delivery-challan-'+todayStr()+'.csv');
}

function showTab(t){
  ['orders','summary','delivery','routes','gps'].forEach(function(x){
    document.getElementById('pg-'+x).classList.toggle('on', x===t);
    document.getElementById('tb-'+x).classList.toggle('on', x===t);
  });
  if(t==='summary')  loadSummary();
  if(t==='delivery') loadDeliveries();
  if(t==='routes')   loadRoutes();
  if(t==='gps')      loadGPS();
}

// ── ORDERS LIST ──
function loadOrders(){
  var el=document.getElementById('ordersList');
  el.innerHTML='<div style="text-align:center;padding:16px;font-size:12px;color:#8a7a6a;font-family:monospace">Loading...</div>';
  api({action:'getOrders',driver:document.getElementById('f-ord-driver').value,date:document.getElementById('f-ord-date').value||todayStr()})
  .then(function(data){
    if(!Array.isArray(data)||!data.length){el.innerHTML='<div style="text-align:center;padding:24px;font-size:13px;color:#8a7a6a;font-family:monospace">No orders.</div>';return;}
    el.innerHTML=data.map(function(o){
      return '<div class="order-card">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
        '<div style="font-size:14px;font-weight:800;color:#4a2f14">'+o.shop_name+'</div>'+
        '<span class="badge DC-'+o.driver+'">'+o.driver+'</span></div>'+
        '<div style="font-size:10px;color:#8a7a6a;font-family:monospace;margin:3px 0 6px">'+o.date+' · '+o.order_id+'</div>'+
        '<div style="font-size:12px;font-family:monospace;background:#f5ede0;padding:7px 10px;border-radius:8px;margin-bottom:7px">'+
        '<b>Items:</b> '+o.items+'<br><b>Qty:</b> '+o.qty+(o.note&&o.note!='—'?'<br><b>Note:</b> '+o.note:'')+'</div>'+
        '<button class="btn-sm btn-del" onclick="deleteOrder(\''+o.order_id+'\')">Delete</button></div>';
    }).join('');
  });
}
function deleteOrder(id){if(!confirm('Delete?'))return;apiPost({action:'deleteOrder',order_id:id}).then(loadOrders);}

// ── SUMMARY ──
function loadSummary(){
  var el=document.getElementById('summaryBody');
  el.innerHTML='<div style="text-align:center;padding:16px;font-size:12px;color:#8a7a6a;font-family:monospace">Loading...</div>';
  api({action:'getOrders',date:document.getElementById('f-sum-date').value||todayStr()}).then(function(data){
    if(!Array.isArray(data)||!data.length){el.innerHTML='<div style="text-align:center;padding:24px;font-size:13px;color:#8a7a6a;font-family:monospace">No orders.</div>';return;}
    var byD={};
    data.forEach(function(o){if(!byD[o.driver])byD[o.driver]=[];byD[o.driver].push(o);});
    var aI={};
    data.forEach(function(o){(o.items||'').split(',').map(function(s){return s.trim();}).filter(Boolean).forEach(function(item){aI[item]=(aI[item]||0)+1;});});
    var h='<div class="card" style="margin-bottom:10px"><div class="lbl">Grand Total</div>'+
      '<div style="font-size:13px;font-weight:800;color:#4a2f14;margin-bottom:6px">'+data.length+' orders · '+Object.keys(byD).length+' drivers</div>'+
      Object.entries(aI).map(function(e){return '<div class="summary-row">'+e[0]+': <b>'+e[1]+'</b></div>';}).join('')+'</div>';
    Object.entries(byD).forEach(function(e){
      var drv=e[0],ords=e[1],dI={};
      ords.forEach(function(o){(o.items||'').split(',').map(function(s){return s.trim();}).filter(Boolean).forEach(function(item){dI[item]=(dI[item]||0)+1;});});
      h+='<div class="summary-card">'+
        '<div style="font-size:15px;font-weight:800;margin-bottom:6px"><span class="badge DC-'+drv+'">'+drv+'</span> · '+ords.length+' shops</div>'+
        ords.map(function(o){return '<div class="summary-row">• '+o.shop_name+' — '+o.items+' ('+o.qty+')</div>';}).join('')+
        '<div style="font-size:13px;font-weight:800;color:#4a2f14;padding-top:6px;border-top:1px solid #f0e8dc">'+
        Object.entries(dI).map(function(e){return e[0]+' x'+e[1];}).join(', ')+'</div></div>';
    });
    el.innerHTML=h;
  });
}

// ── DELIVERY ──
function loadDeliveries(){
  var el=document.getElementById('deliveryList');
  el.innerHTML='<div style="text-align:center;padding:16px;font-size:12px;color:#8a7a6a;font-family:monospace">Loading...</div>';
  var drv=document.getElementById('f-del-driver').value,dt=document.getElementById('f-del-date').value||todayStr();
  Promise.all([api({action:'getOrders',driver:drv,date:dt}),api({action:'getDeliveries',driver:drv,date:dt}),api({action:'getRoutes',driver:drv,date:dt})])
  .then(function(res){
    var ords=Array.isArray(res[0])?res[0]:[],dels=Array.isArray(res[1])?res[1]:[],rts=Array.isArray(res[2])?res[2]:[];
    var dM={};dels.forEach(function(d){dM[d.shop_id]=d;});
    document.getElementById('delivStats').innerHTML=
      '<div class="stat"><div class="stat-n">'+ords.length+'</div><div class="stat-l">Total</div></div>'+
      '<div class="stat"><div class="stat-n" style="color:#2d7a4f">'+dels.length+'</div><div class="stat-l">Done</div></div>'+
      '<div class="stat"><div class="stat-n" style="color:#c8382a">'+(ords.length-dels.length)+'</div><div class="stat-l">Pending</div></div>';
    if(!ords.length){el.innerHTML='<div style="text-align:center;padding:24px;font-size:13px;color:#8a7a6a;font-family:monospace">No orders.</div>';return;}
    var ri='';
    if(rts.length) ri='<div class="card" style="margin-bottom:10px"><div class="lbl">Routes</div>'+rts.map(function(r){return '<div style="font-size:12px;font-family:monospace;padding:3px 0"><span class="badge DC-'+r.driver+'">'+r.driver+'</span> '+(r.start_time||'not started')+' · '+(r.total_shops||'?')+' shops</div>';}).join('')+'</div>';
    el.innerHTML=ri+ords.map(function(o){
      var dn=!!dM[o.shop_id];
      return '<div class="deliv-row"><div style="flex:1">'+
        '<div style="font-size:13px;font-weight:800">'+o.shop_name+'</div>'+
        '<div style="font-size:10px;color:#8a7a6a;font-family:monospace;margin-top:2px"><span class="badge DC-'+o.driver+'">'+o.driver+'</span> · '+o.items+'</div>'+
        (dn?'<div style="font-size:10px;font-family:monospace;color:#2d7a4f;margin-top:2px">Done '+(dM[o.shop_id].time||'')+'</div>':'')+
        '</div><span class="badge '+(dn?'b-done':'b-miss')+'">'+(dn?'Done':'Pending')+'</span></div>';
    }).join('');
  });
}

// ── ROUTES ──
var routesData=[];
function loadRoutes(){
  var el=document.getElementById('routesList');
  el.innerHTML='<div style="text-align:center;padding:16px;font-size:12px;color:#8a7a6a;font-family:monospace">Loading...</div>';
  api({action:'getRoutes',date:document.getElementById('f-rt-date').value||todayStr(),driver:document.getElementById('f-rt-driver').value})
  .then(function(data){
    routesData=Array.isArray(data)?data:[];
    var ts=routesData.reduce(function(s,r){return s+(parseInt(r.total_shops)||0);},0);
    var tk=routesData.reduce(function(s,r){return s+(parseInt(r.total_km)||0);},0);
    document.getElementById('routeStats').innerHTML=
      '<div class="stat"><div class="stat-n">'+routesData.length+'</div><div class="stat-l">Drivers</div></div>'+
      '<div class="stat"><div class="stat-n">'+ts+'</div><div class="stat-l">Shops</div></div>'+
      '<div class="stat"><div class="stat-n">'+tk+'</div><div class="stat-l">KM</div></div>';
    if(!routesData.length){el.innerHTML='<div style="text-align:center;padding:24px;font-size:13px;color:#8a7a6a;font-family:monospace">No routes.</div>';return;}
    el.innerHTML=routesData.map(function(r){
      var sh=[];try{sh=JSON.parse(r.shop_order||'[]');}catch(e){}
      return '<div class="driver-card">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
        '<div style="font-size:15px;font-weight:800">'+r.driver+'</div>'+
        '<div style="display:flex;gap:4px"><span class="badge b-ok">'+r.total_shops+' shops</span><span class="badge b-warn">'+r.total_km+'km</span></div></div>'+
        '<div style="font-size:10px;color:#8a7a6a;font-family:monospace;margin-bottom:6px">Started: '+(r.start_time||'not started')+'</div>'+
        sh.map(function(s,j){return '<div class="route-mini">'+(j+1)+'. '+s+'</div>';}).join('')+'</div>';
    }).join('');
  });
}

// ── GPS ──
var gpsShops=[];
function loadGPS(){api({action:'getShops'}).then(function(d){gpsShops=Array.isArray(d)?d:[];renderGPS();});}
function renderGPS(){
  var drv=document.getElementById('f-gps-driver').value,st=document.getElementById('f-gps-status').value;
  var list=gpsShops;
  if(drv) list=list.filter(function(s){return s.assigned_driver===drv;});
  if(st==='saved') list=list.filter(function(s){return s.lat;});
  if(st==='missing') list=list.filter(function(s){return !s.lat;});
  var sv=gpsShops.filter(function(s){return s.lat;}).length;
  document.getElementById('gpsStats').innerHTML=
    '<div class="stat"><div class="stat-n">'+gpsShops.length+'</div><div class="stat-l">Total</div></div>'+
    '<div class="stat"><div class="stat-n" style="color:#2d7a4f">'+sv+'</div><div class="stat-l">Saved</div></div>'+
    '<div class="stat"><div class="stat-n" style="color:#c8382a">'+(gpsShops.length-sv)+'</div><div class="stat-l">Missing</div></div>';
  document.getElementById('gpsList').innerHTML=list.map(function(s){
    return '<div class="order-card">'+
      '<div style="display:flex;justify-content:space-between">'+
      '<div style="font-size:14px;font-weight:800;color:#4a2f14">'+s.name+'</div>'+
      '<span class="badge '+(s.lat?'b-ok':'b-miss')+'">'+(s.lat?'GPS':'No GPS')+'</span></div>'+
      '<div style="font-size:10px;color:#8a7a6a;font-family:monospace;margin:3px 0 6px">'+(s.area||'')+' · <span class="badge DC-'+(s.assigned_driver||'Dinesh')+'">'+(s.assigned_driver||'-')+'</span></div>'+
      (s.lat?'<div style="font-size:11px;font-family:monospace;color:#2d7a4f;margin-bottom:6px">'+s.lat+', '+s.lng+'</div>'+
      '<button class="btn-sm btn-map" onclick="window.open(\'https://www.google.com/maps?q='+s.lat+','+s.lng+'\',\'_blank\')">Map</button>':'')+
      '</div>';
  }).join('');
}

// ── EXPORTS ──
function exportRouteCSV(){dlCSV([['Date','Driver','Start','Shops','KM','Est']].concat(routesData.map(function(r){return[r.date,r.driver,r.start_time||'',r.total_shops,r.total_km,r.est_time];})),'routes-'+todayStr()+'.csv');}
function exportGPSCSV(){dlCSV([['Shop','Area','Driver','Lat','Lng']].concat(gpsShops.map(function(s){return[s.name,s.area,s.assigned_driver,s.lat||'',s.lng||''];})),'gps-'+todayStr()+'.csv');}
function dlCSV(rows,fn){var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c||'').replace(/"/g,'""')+'"';}).join(',');}).join('\n');var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);}

loadOrders();
</script>
</body>
</html>
