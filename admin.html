<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Baked — Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5ede0;color:#1e1611;max-width:520px;margin:0 auto;min-height:100vh}
.topbar{background:#4a2f14;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99}
.topbar-title{color:#fff;font-size:15px;font-weight:800}
.topbar-sub{color:#c8a87a;font-size:11px;font-family:monospace}
.topbar-right{display:flex;gap:8px}
.tbtn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 11px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:-apple-system,sans-serif;text-decoration:none;display:inline-block}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e8dfd2;position:sticky;top:53px;z-index:98;overflow-x:auto}
.tab{flex:1;min-width:70px;padding:11px 4px;border:none;background:none;font-size:11px;font-weight:700;cursor:pointer;color:#8a7a6a;font-family:-apple-system,sans-serif;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:#4a2f14;border-bottom-color:#4a2f14}
.page{display:none;padding:12px 14px 80px}.page.on{display:block}
.card{background:#fff;border:1.5px solid #e8dfd2;border-radius:16px;padding:14px;margin-bottom:10px}
.lbl{font-size:10px;letter-spacing:2px;color:#8a7a6a;font-family:monospace;font-weight:700;margin-bottom:8px;text-transform:uppercase}
select,input[type=text],input[type=date],input[type=password],textarea{width:100%;padding:11px 14px;border:1.5px solid #e8dfd2;border-radius:10px;font-size:14px;color:#1e1611;background:#f5ede0;outline:none;-webkit-appearance:none;font-family:-apple-system,sans-serif;margin-bottom:8px}
textarea{resize:vertical;min-height:140px;font-size:13px;line-height:1.7}
.btn{width:100%;padding:13px;border:none;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;font-family:-apple-system,sans-serif;margin-bottom:8px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-parse{background:#1a73e8;color:#fff}
.btn-confirm{background:#2d7a4f;color:#fff}
.btn-refresh{background:#e8dfd2;color:#4a2f14}
.btn-sm{padding:7px 11px;border-radius:10px;font-size:11px;font-weight:700;border:none;cursor:pointer;font-family:-apple-system,sans-serif}
.btn-del{background:#fde8e8;color:#c8382a}
.btn-map{background:#e3f2fd;color:#1565c0}
.btn-csv{background:#e8f5e9;color:#2d7a4f;width:100%;padding:12px;border-radius:12px;font-size:14px;font-weight:800;border:none;cursor:pointer;font-family:-apple-system,sans-serif;margin-bottom:10px}
.msg{padding:11px 14px;border-radius:12px;font-size:12px;font-weight:600;font-family:monospace;margin-bottom:10px;line-height:1.8;white-space:pre-line}
.ok{background:#e8f5e9;color:#2d7a4f;border:1px solid #a5d6a7}
.er{background:#fde8e8;color:#c8382a;border:1px solid #f0b0b0}
.in{background:#e3f2fd;color:#1565c0;border:1px solid #90caf9}
.warn{background:#fff8e1;color:#7a4800;border:1px solid #ffe082}
.summary-card{background:#fff;border:1.5px solid #e8dfd2;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.summary-row{font-size:12px;font-family:monospace;padding:3px 0;border-bottom:1px solid #f0e8dc}
.order-card{background:#fff;border:1.5px solid #e8dfd2;border-radius:14px;padding:11px 14px;margin-bottom:8px}
.deliv-row{background:#fff;border:1.5px solid #e8dfd2;border-radius:12px;padding:10px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1.5px solid #e8dfd2;border-radius:12px;padding:10px;text-align:center}
.stat-n{font-size:20px;font-weight:900;color:#4a2f14}
.stat-l{font-size:9px;color:#8a7a6a;font-family:monospace}
.driver-card{background:#fff;border:1.5px solid #e8dfd2;border-radius:14px;padding:13px;margin-bottom:10px}
.route-mini{font-size:11px;font-family:monospace;padding:3px 0;border-bottom:1px solid #f0e8dc}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;font-family:monospace}
.b-ok{background:#e8f5e9;color:#2d7a4f}.b-warn{background:#fff8e1;color:#7a4800}
.b-miss{background:#fde8e8;color:#c8382a}.b-done{background:#e8f5e9;color:#2d7a4f}
.filter-row{display:flex;gap:8px;margin-bottom:8px}
.filter-row select,.filter-row input{margin-bottom:0}
.DC-Bharat{background:#fff3e0;color:#c8864a}.DC-Anand{background:#e3f2fd;color:#1a5fa8}
.DC-Vikas{background:#e8f5e9;color:#2d7a4f}.DC-Yuvraj{background:#f3e8ff;color:#6e3da8}
.DC-Rama{background:#fde8e8;color:#c8382a}.DC-Dinesh{background:#fce4ec;color:#880e4f}
.itag{display:inline-block;background:#f5ede0;border:1px solid #e8dfd2;padding:3px 8px;border-radius:6px;font-size:11px;font-family:monospace;margin:2px 2px 2px 0}
.itag b{color:#4a2f14}
.parse-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.ps{background:#fff;border:1.5px solid #e8dfd2;border-radius:10px;padding:8px;text-align:center}
.ps-n{font-size:18px;font-weight:900;color:#4a2f14}
.ps-l{font-size:8px;color:#8a7a6a;font-family:monospace;text-transform:uppercase;letter-spacing:1px}
.parsed-item{background:#fff;border:1.5px solid #e8dfd2;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.parsed-item.unmatched{border-color:#f0b0b0;background:#fff8f8}
.parsed-item.collapsed .pi-body{display:none}
.pi-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.pi-toggle{font-size:10px;color:#8a7a6a;padding:2px 6px;background:#f5ede0;border-radius:4px}
.hint-box{background:#e8f0fe;border:1.5px dashed #4285f4;border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:11px;font-family:monospace;color:#1a73e8;line-height:1.8}
.hint-box b{color:#174ea6}
.ai-loader{display:flex;align-items:center;gap:10px;padding:14px;background:#e8f0fe;border:1.5px solid #a8c7fa;border-radius:14px;margin-bottom:10px}
.ai-dot{width:8px;height:8px;background:#1a73e8;border-radius:50%;animation:pulse .8s infinite alternate}
.ai-dot:nth-child(2){animation-delay:.2s}.ai-dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%{opacity:.3;transform:scale(.8)}100%{opacity:1;transform:scale(1.2)}}
.ai-label{font-size:12px;font-weight:700;color:#1a73e8;font-family:monospace}
.key-box{background:#fff;border:1.5px solid #e8dfd2;border-radius:14px;padding:14px;margin-bottom:10px}
.key-status{display:flex;align-items:center;gap:8px;font-size:12px;font-family:monospace;padding:8px 12px;border-radius:8px;margin-bottom:8px}
.key-ok{background:#e8f5e9;color:#2d7a4f}
.key-miss{background:#fff8e1;color:#7a4800}
</style>
</head>
<body>

<div class="topbar">
  <div><div class="topbar-title">🍞 Baked Admin</div><div class="topbar-sub" id="topDate"></div></div>
  <div class="topbar-right"><a href="shops.html" class="tbtn">🏪 Shops</a><button class="tbtn" onclick="logout()">Logout</button></div>
</div>

<div class="tabs">
  <button class="tab on" id="tb-orders"   onclick="showTab('orders')">📋 Orders</button>
  <button class="tab"    id="tb-summary"  onclick="showTab('summary')">📊 Summary</button>
  <button class="tab"    id="tb-delivery" onclick="showTab('delivery')">🚚 Delivery</button>
  <button class="tab"    id="tb-routes"   onclick="showTab('routes')">🗺 Routes</button>
  <button class="tab"    id="tb-gps"      onclick="showTab('gps')">📍 GPS</button>
</div>

<!-- ══ ORDERS ══ -->
<div class="page on" id="pg-orders">

  <!-- Paste Order -->
  <div class="card">
    <div class="lbl">📋 Paste WhatsApp Orders</div>
    <div class="hint-box">
      <b>🤖 Gemini AI Parser</b><br>
      Paste the forwarded WhatsApp order directly — any format.<br>
      AI reads, structures and assigns driver automatically.<br>
      ✅ Known shops → correct driver · ⚠ New shops → <b>Dinesh</b>
    </div>
    <textarea id="orderPaste" placeholder="Paste WhatsApp order here…&#10;&#10;Works with:&#10;• Original WhatsApp chat (multiline)&#10;• Forwarded email (bold *format*)&#10;• Mixed formats"></textarea>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <button class="btn-sm btn-del" style="flex:1;padding:10px" onclick="document.getElementById('orderPaste').value=''">Clear</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <div style="flex:1">
        <div class="lbl" style="margin-bottom:4px">Delivery Date</div>
        <input type="date" id="ord-date" style="margin-bottom:0">
      </div>
    </div>
    <div id="parse-msg" style="display:none" class="msg in"></div>
    <div id="ai-loading" style="display:none" class="ai-loader">
      <div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div>
      <div class="ai-label">Gemini is reading orders… 5–10 sec</div>
    </div>
    <button class="btn btn-parse" id="parseBtn" onclick="parseWithGemini()">🤖 Parse with Gemini AI</button>
  </div>

  <!-- Preview -->
  <div id="parseStatsBox" style="display:none"><div class="parse-stats" id="parseStats"></div></div>
  <div id="previewBox" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-size:13px;font-weight:800;color:#4a2f14" id="previewTitle"></div>
      <button class="btn-sm" style="background:#f5ede0;color:#4a2f14" onclick="toggleAll()">▼ Toggle all</button>
    </div>
    <div id="previewList"></div>
    <div id="preview-warn" style="display:none" class="msg warn"></div>
    <button class="btn btn-confirm" id="confirmBtn" onclick="confirmAll()">✅ Confirm & Save All Orders</button>
    <button class="btn btn-refresh" onclick="clearPreview()">✖ Cancel</button>
  </div>

  <!-- Orders list -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px">
    <div style="font-size:13px;font-weight:800;color:#4a2f14">Saved Orders</div>
    <button class="btn-sm btn-refresh" onclick="loadOrders()">🔄</button>
  </div>
  <div class="filter-row">
    <select id="f-ord-driver" onchange="loadOrders()">
      <option value="">All Drivers</option>
      <option>Bharat</option><option>Anand</option><option>Vikas</option><option>Yuvraj</option><option>Rama</option><option>Dinesh</option>
    </select>
    <input type="date" id="f-ord-date" onchange="loadOrders()" style="margin-bottom:0">
  </div>
  <div id="ordersList"></div>
</div>

<!-- ══ SUMMARY ══ -->
<div class="page" id="pg-summary">
  <div class="filter-row"><input type="date" id="f-sum-date" onchange="loadSummary()" style="margin-bottom:0"></div>
  <button class="btn btn-refresh" onclick="loadSummary()">🔄 Refresh</button>
  <div id="summaryBody"></div>
</div>

<!-- ══ DELIVERY ══ -->
<div class="page" id="pg-delivery">
  <div class="stats-grid" id="delivStats"></div>
  <div class="filter-row">
    <select id="f-del-driver" onchange="loadDeliveries()"><option value="">All</option><option>Bharat</option><option>Anand</option><option>Vikas</option><option>Yuvraj</option><option>Rama</option></select>
    <input type="date" id="f-del-date" onchange="loadDeliveries()" style="margin-bottom:0">
  </div>
  <button class="btn btn-refresh" onclick="loadDeliveries()">🔄 Refresh</button>

<!-- ══ ROUTES ══ -->
<div class="page" id="pg-routes">
  <div class="stats-grid" id="routeStats"></div>
  <div class="filter-row">
    <select id="f-rt-driver" onchange="loadRoutes()"><option value="">All</option><option>Bharat</option><option>Anand</option><option>Vikas</option><option>Yuvraj</option><option>Rama</option></select>
    <input type="date" id="f-rt-date" onchange="loadRoutes()" style="margin-bottom:0">
  </div>
  <button class="btn btn-refresh" onclick="loadRoutes()">🔄 Refresh</button>

<!-- ══ GPS ══ -->
<div class="page" id="pg-gps">
  <div class="stats-grid" id="gpsStats"></div>
  <div class="filter-row">
    <select id="f-gps-driver" onchange="renderGPS()"><option value="">All</option><option>Bharat</option><option>Anand</option><option>Vikas</option><option>Yuvraj</option><option>Rama</option><option>Dinesh</option></select>
    <select id="f-gps-status" onchange="renderGPS()"><option value="">All</option><option value="saved">✅ Saved</option><option value="missing">⚠ Missing</option></select>
  </div>
  <button class="btn-csv" onclick="exportGPSCSV()">⬇️ Export CSV</button>
  <div id="gpsList"></div>
</div>

<script>
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbyi-IJ6NLR28hRTeesy52THTbdcYCSnz3lp7NtEaJsxBOiNOm-9emMu0xOHT6hvWSE-/exec',
  DRIVERS: ['Bharat','Anand','Vikas','Yuvraj','Rama'],
  ADMIN_PASS: 'baked@admin',
  UNASSIGNED: 'Dinesh'
};

if(sessionStorage.getItem('role')!=='admin') window.location.href='index.html';

const API = CONFIG.API_URL;
function api(p){ return fetch(API+'?'+new URLSearchParams(p)).then(r=>r.json()).catch(()=>[]); }
function apiPost(b){ return fetch(API,{method:'POST',body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>{}); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function logout(){ sessionStorage.clear(); window.location.href='index.html'; }

document.getElementById('topDate').textContent = new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'});
['ord-date','f-ord-date','f-rt-date','f-sum-date','f-del-date'].forEach(id=>{ document.getElementById(id).value=todayStr(); });

function showTab(t){
  ['orders','summary','delivery','routes','gps'].forEach(x=>{
    document.getElementById('pg-'+x).classList.toggle('on',x===t);
    document.getElementById('tb-'+x).classList.toggle('on',x===t);
  });
  if(t==='summary') loadSummary();
  if(t==='delivery') loadDeliveries();
  if(t==='routes') loadRoutes();
  if(t==='gps') loadGPS();
}

// ── GEMINI KEY ──
let GEMINI_KEY = 'AIzaSyBibBFw-030gXBDuk9jL0jQFbUYVBMNSjY';

// ── SHOPS ──
let allShops=[], parsedOrders=[];
async function loadShops(){ const d=await api({action:'getShops'}); if(Array.isArray(d)) allShops=d; }
loadShops();

function nrm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ').trim(); }
function fuzzyMatch(name, area){
  const q=nrm(name), qa=nrm(area||'');
  let m=allShops.find(s=>nrm(s.name)===q); if(m) return m;
  const qw=q.split(' ').filter(w=>w.length>1);
  let best=null, bs=0;
  allShops.forEach(s=>{
    const sn=nrm(s.name), sa=nrm(s.area||'');
    let sc=0;
    qw.forEach(w=>{ if(sn.includes(w)) sc+=w.length*2; });
    qa.split(' ').filter(w=>w.length>2).forEach(w=>{ if(sa.includes(w)) sc+=w.length; });
    if(qa && sa===qa) sc+=5;
    if(sc>bs){bs=sc;best=s;}
  });
  return bs>=5?best:null;
}

// ── GEMINI AI PARSE ──
async function callGemini(text, attempt=1){
  if(!GEMINI_KEY) throw new Error('No Gemini API key — add it above (free from aistudio.google.com)');

  const prompt = `You are a bakery order parser for "It's Baked" bakery in Pune, India.

Parse this WhatsApp order message. It may be:
- Original WhatsApp multiline (each line = one piece of info)
- Forwarded email (all in one line with *bold* markers)

RULES:
1. Each shop block: SHOP NAME → AREA/LOCATION → DATE → ITEMS
2. *BREAD 5x5* or *BUN 4 inch* = CATEGORY HEADER for next items:
   - After *BREAD 5x5*: "White - 1" = "White Bread 5x5", "Brown - 3" = "Brown Bread 5x5"
   - But "Sweet Bun - 4" is already a full name, ignore the prefix
3. *4 inch*, *EGG*, *PLAIN*, *MIX SEEDS*, *5x5*, *WITHOUT MOULD* = spec/size for the item above
4. Sub-brands like *PJS Hospitality*, *MILA's KITCHEN* = skip, not a new shop
5. Dates like 30.03.26 or 30/03/2026 = delivery date, convert to YYYY-MM-DD
6. Same shop at different areas = separate orders (BURGER BARN KP vs BURGER BARN MG ROAD)
7. IGNORE: "TOTAL COUNT", "Please send", "Morning", "Pick Up"
8. Emoji = ignore for naming (🍔🍩🥖🥚🍼🥬🥔🫛⬜🟫)

Return ONLY a JSON array, no markdown, no explanation:
[{"shop_name":"shop name","area":"location","date":"YYYY-MM-DD or empty","items":[{"name":"full item name with size","qty":number,"spec":"egg/plain/seeds/etc or empty"}]}]

Message:
${text}`;

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`,
    {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{parts:[{text:prompt}]}],
        generationConfig:{
          temperature:0.1,
          responseMimeType:'application/json',
          maxOutputTokens:8192
        }
      })
    }
  );

  if(!res.ok){
    const e=await res.text();
    if(res.status===400&&e.includes('API_KEY_INVALID')) throw new Error('Invalid API key');
    if(res.status===429){
      if(attempt<=3){
        const wait=attempt*20; // 20s, 40s, 60s
        document.getElementById('ai-loading').querySelector('.ai-label').textContent=
          `Rate limit — retrying in ${wait}s (attempt ${attempt}/3)…`;
        await new Promise(r=>setTimeout(r,wait*1000));
        return callGemini(text, attempt+1);
      }
      throw new Error('Rate limit — try again in 2 minutes');
    }
    throw new Error('Gemini error '+res.status);
  }

  const data=await res.json();
  const txt=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
  if(!txt) throw new Error('Empty response from Gemini');

  // Handle truncated JSON gracefully
  let clean=txt.replace(/```json|```/g,'').trim();
  // If JSON is cut off, try to close it
  if(!clean.endsWith(']')){
    const lastBrace=clean.lastIndexOf('}');
    if(lastBrace>0) clean=clean.slice(0,lastBrace+1)+']';
  }
  try {
    return JSON.parse(clean);
  } catch(e) {
    // Try to extract whatever valid objects we have
    const matches=clean.match(/\{[^{}]*"shop_name"[^{}]*\}/g);
    if(matches&&matches.length) return matches.map(m=>{try{return JSON.parse(m);}catch(e){return null;}}).filter(Boolean);
    throw new Error('Could not parse Gemini response. Try with fewer shops at once.');
  }
}

async function parseWithGemini(){
  const raw=document.getElementById('orderPaste').value.trim();
  const pmsg=document.getElementById('parse-msg');
  const loader=document.getElementById('ai-loading');
  const btn=document.getElementById('parseBtn');

  if(!GEMINI_KEY){
    pmsg.textContent='⚠ Add Gemini API key first (free from aistudio.google.com)';
    pmsg.className='msg warn'; pmsg.style.display='block';
    document.getElementById('keyBox').scrollIntoView({behavior:'smooth'}); return;
  }
  if(!raw){ pmsg.textContent='❌ Paste order text first'; pmsg.className='msg er'; pmsg.style.display='block'; return; }
  if(!allShops.length){ await loadShops(); }

  btn.disabled=true; btn.textContent='🤖 Parsing… keep screen on';
  loader.style.display='flex'; pmsg.style.display='none';

  // Keep screen awake if Wake Lock API available
  let wakeLock=null;
  try{ if(navigator.wakeLock) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}

  try {
    const aiOrders = await callGemini(raw);
    if(!Array.isArray(aiOrders)||!aiOrders.length) throw new Error('No orders found in message');

    parsedOrders=[];
    let matched=0, unmatched=0, totalItems=0;

    aiOrders.forEach(o=>{
      const shop = fuzzyMatch(o.shop_name, o.area);
      const items = (o.items||[]).map(it=>({
        name: it.name||'?',
        qty: parseInt(it.qty)||0,
        spec: it.spec||''
      }));
      totalItems += items.length;
      parsedOrders.push({
        shop_id: shop?shop.shop_id:'',
        shop_name: shop?shop.name:o.shop_name,
        area: shop?(shop.area||o.area):(o.area||''),
        driver: shop?(shop.assigned_driver||CONFIG.UNASSIGNED):CONFIG.UNASSIGNED,
        items, date:o.date||'',
        matched:!!shop, raw_name:o.shop_name
      });
      shop?matched++:unmatched++;
    });

    document.getElementById('parseStatsBox').style.display='block';
    document.getElementById('parseStats').innerHTML=`
      <div class="ps"><div class="ps-n">${parsedOrders.length}</div><div class="ps-l">Shops</div></div>
      <div class="ps"><div class="ps-n" style="color:#2d7a4f">${matched}</div><div class="ps-l">Matched</div></div>
      <div class="ps"><div class="ps-n" style="color:#c8382a">${unmatched}</div><div class="ps-l">New</div></div>
      <div class="ps"><div class="ps-n" style="color:#1a73e8">${totalItems}</div><div class="ps-l">Items</div></div>`;

    pmsg.textContent=`✅ ${parsedOrders.length} shops · ${matched} matched · ${unmatched} new → Dinesh`;
    pmsg.className='msg ok'; pmsg.style.display='block';
    renderPreview();

  } catch(err){
    console.error(err);
    pmsg.textContent='❌ '+err.message;
    pmsg.className='msg er'; pmsg.style.display='block';
  } finally {
    btn.disabled=false; btn.textContent='🤖 Parse with Gemini AI';
    loader.style.display='none';
    if(wakeLock) try{ await wakeLock.release(); }catch(e){}
  }
}

// ── PREVIEW ──
let collapsed=false;
function toggleAll(){ collapsed=!collapsed; document.querySelectorAll('.parsed-item').forEach(el=>el.classList.toggle('collapsed',collapsed)); }

function renderPreview(){
  document.getElementById('previewBox').style.display='block';
  document.getElementById('previewTitle').textContent=`Preview — ${parsedOrders.length} Orders`;
  const unm=parsedOrders.filter(o=>!o.matched);
  const pw=document.getElementById('preview-warn');
  if(unm.length){ pw.textContent=`⚠ ${unm.length} new shop(s) → Dinesh:\n${unm.map(o=>o.raw_name).join(', ')}`; pw.style.display='block'; }
  else { pw.style.display='none'; }

  document.getElementById('previewList').innerHTML=parsedOrders.map((o,i)=>{
    const tags=o.items.map(it=>`<span class="itag"><b>${it.qty}×</b> ${it.name}${it.spec?` <span style="color:#8a7a6a">(${it.spec})</span>`:''}</span>`).join('');
    return `<div class="parsed-item ${o.matched?'':'unmatched'}" id="pi-${i}">
      <div class="pi-head" onclick="document.getElementById('pi-${i}').classList.toggle('collapsed')">
        <div>
          <div style="font-size:14px;font-weight:800;color:#4a2f14">${o.shop_name}</div>
          <div style="font-size:10px;color:#8a7a6a;font-family:monospace;margin-top:2px">${o.area} · ${o.matched?'✅ matched':'⚠ NEW'} · ${o.items.length} items · ${o.date||'no date'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="badge DC-${o.driver}">${o.driver}</span>
          <span class="pi-toggle">▾</span>
        </div>
      </div>
      <div class="pi-body" style="margin-top:8px">
        <div style="margin-bottom:6px">${tags||'<span style="color:#c8382a;font-size:11px">No items parsed</span>'}</div>
        ${!o.matched?`<div style="display:flex;gap:8px;align-items:center;margin-top:6px">
          <span style="font-size:11px;color:#8a7a6a">Reassign:</span>
          <select onchange="parsedOrders[${i}].driver=this.value" style="padding:5px 10px;font-size:12px;background:#f5ede0;border:1px solid #e8dfd2;border-radius:6px;flex:1">
            ${['Dinesh','Bharat','Anand','Vikas','Yuvraj','Rama'].map(d=>`<option ${o.driver===d?'selected':''}>${d}</option>`).join('')}
          </select></div>`:''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('previewBox').scrollIntoView({behavior:'smooth',block:'start'});
}

async function confirmAll(){
  const btn=document.getElementById('confirmBtn'); btn.textContent='⏳ Saving…'; btn.disabled=true;
  const dateInput=document.getElementById('ord-date').value||todayStr();
  let ok=0,fail=0;
  for(const o of parsedOrders){
    const date=o.date||dateInput;
    const res=await apiPost({
      action:'addOrder', driver:o.driver, shop_id:o.shop_id, shop_name:o.shop_name,
      items:o.items.map(it=>it.name+(it.spec?' ('+it.spec+')':'')).join(', '),
      qty:o.items.map(it=>it.qty).join(', '),
      note:o.matched?'':'NEW SHOP - '+o.area,
      date
    });
    res&&res.ok?ok++:fail++;
  }
  btn.textContent='✅ Confirm & Save'; btn.disabled=false;
  const pm=document.getElementById('parse-msg');
  pm.textContent=`✅ ${ok} saved!${fail?' ❌ '+fail+' failed.':''}`;
  pm.className='msg ok'; pm.style.display='block';
  clearPreview(); loadOrders();
}

function clearPreview(){
  document.getElementById('previewBox').style.display='none';
  document.getElementById('parseStatsBox').style.display='none';
  parsedOrders=[];
}

// ── ORDERS ──
async function loadOrders(){
  const el=document.getElementById('ordersList');
  el.innerHTML='<div style="text-align:center;padding:16px;font-size:12px;color:#8a7a6a;font-family:monospace">Loading…</div>';
  const data=await api({action:'getOrders',driver:document.getElementById('f-ord-driver').value,date:document.getElementById('f-ord-date').value||todayStr()});
  if(!Array.isArray(data)||!data.length){ el.innerHTML='<div style="text-align:center;padding:24px;font-size:13px;color:#8a7a6a;font-family:monospace">No orders.</div>'; return; }
  el.innerHTML=data.map(o=>`
    <div class="order-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="font-size:14px;font-weight:800;color:#4a2f14">${o.shop_name}</div>
        <span class="badge DC-${o.driver}">${o.driver}</span>
      </div>
      <div style="font-size:10px;color:#8a7a6a;font-family:monospace;margin:3px 0 6px">${o.date} · ${o.order_id}</div>
      <div style="font-size:12px;font-family:monospace;background:#f5ede0;padding:7px 10px;border-radius:8px;margin-bottom:7px">
        <b>Items:</b> ${o.items}<br><b>Qty:</b> ${o.qty}${o.note&&o.note!=='—'?'<br><b>Note:</b> '+o.note:''}
      </div>
      <button class="btn-sm btn-del" onclick="deleteOrder('${o.order_id}')">🗑 Delete</button>
    </div>`).join('');
}
async function deleteOrder(id){ if(!confirm('Delete?'))return; await apiPost({action:'deleteOrder',order_id:id}); loadOrders(); }

// ── SUMMARY ──
async function loadSummary(){
  const el=document.getElementById('summaryBody');
  el.innerHTML='<div style="text-align:center;padding:16px;font-size:12px;color:#8a7a6a;font-family:monospace">Loading…</div>';
  const data=await api({action:'getOrders',date:document.getElementById('f-sum-date').value||todayStr()});
  if(!Array.isArray(data)||!data.length){ el.innerHTML='<div style="text-align:center;padding:24px;font-size:13px;color:#8a7a6a;font-family:monospace">No orders.</div>'; return; }
  const byD={};
  data.forEach(o=>{ if(!byD[o.driver]) byD[o.driver]=[]; byD[o.driver].push(o); });
  const aI={};
  data.forEach(o=>{ (o.items||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(item=>{ aI[item]=(aI[item]||0)+1; }); });
  let h=`<div class="card" style="margin-bottom:10px"><div class="lbl">Grand Total — All Drivers</div>
    <div style="font-size:13px;font-weight:800;color:#4a2f14;margin-bottom:6px">${data.length} orders · ${Object.keys(byD).length} drivers</div>
    ${Object.entries(aI).map(([i,c])=>`<div class="summary-row">${i}: <b>${c}</b></div>`).join('')}</div>`;
  Object.entries(byD).forEach(([drv,ords])=>{
    const dI={};
    ords.forEach(o=>{ (o.items||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(item=>{ dI[item]=(dI[item]||0)+1; }); });
    h+=`<div class="summary-card">
      <div style="font-size:15px;font-weight:800;margin-bottom:6px"><span class="badge DC-${drv}">${drv}</span> · ${ords.length} shops</div>
      ${ords.map(o=>`<div class="summary-row">• ${o.shop_name} — ${o.items} (${o.qty})</div>`).join('')}
      <div style="font-size:13px;font-weight:800;color:#4a2f14;padding-top:6px;border-top:1px solid #f0e8dc">${Object.entries(dI).map(([i,c])=>i+' ×'+c).join(', ')}</div>
    </div>`;
  });
  el.innerHTML=h;
}

// ── DELIVERY ──
async function loadDeliveries(){
  const el=document.getElementById('deliveryList');
  el.innerHTML='<div style="text-align:center;padding:16px;font-size:12px;color:#8a7a6a;font-family:monospace">Loading…</div>';
  const drv=document.getElementById('f-del-driver').value, dt=document.getElementById('f-del-date').value||todayStr();
  const[oA,dA,rA]=await Promise.all([api({action:'getOrders',driver:drv,date:dt}),api({action:'getDeliveries',driver:drv,date:dt}),api({action:'getRoutes',driver:drv,date:dt})]);
  const ords=Array.isArray(oA)?oA:[], dels=Array.isArray(dA)?dA:[], rts=Array.isArray(rA)?rA:[];
  const dM={}; dels.forEach(d=>dM[d.shop_id]=d);
  document.getElementById('delivStats').innerHTML=`
    <div class="stat"><div class="stat-n">${ords.length}</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-n" style="color:#2d7a4f">${dels.length}</div><div class="stat-l">Done</div></div>
    <div class="stat"><div class="stat-n" style="color:#c8382a">${ords.length-dels.length}</div><div class="stat-l">Pending</div></div>`;
  if(!ords.length){ el.innerHTML='<div style="text-align:center;padding:24px;font-size:13px;color:#8a7a6a;font-family:monospace">No orders.</div>'; return; }
  let ri='';
  if(rts.length) ri=`<div class="card" style="margin-bottom:10px"><div class="lbl">Route Status</div>${rts.map(r=>`<div style="font-size:12px;font-family:monospace;padding:3px 0"><span class="badge DC-${r.driver}">${r.driver}</span> started ${r.start_time||'—'} · ${r.total_shops||'?'} shops</div>`).join('')}</div>`;
  el.innerHTML=ri+ords.map(o=>{
    const dn=!!dM[o.shop_id];
    return `<div class="deliv-row"><div style="flex:1">
      <div style="font-size:13px;font-weight:800">${o.shop_name}</div>
      <div style="font-size:10px;color:#8a7a6a;font-family:monospace;margin-top:2px"><span class="badge DC-${o.driver}">${o.driver}</span> · ${o.items}</div>
      ${dn?`<div style="font-size:10px;font-family:monospace;color:#2d7a4f;margin-top:2px">✅ ${dM[o.shop_id]?.time||''}</div>`:''}
    </div><span class="badge ${dn?'b-done':'b-miss'}">${dn?'Done':'Pending'}</span></div>`;
  }).join('');
}

// ── ROUTES ──
let routesData=[];
async function loadRoutes(){
  const el=document.getElementById('routesList');
  el.innerHTML='<div style="text-align:center;padding:16px;font-size:12px;color:#8a7a6a;font-family:monospace">Loading…</div>';
  routesData=await api({action:'getRoutes',date:document.getElementById('f-rt-date').value||todayStr(),driver:document.getElementById('f-rt-driver').value});
  if(!Array.isArray(routesData)) routesData=[];
  const ts=routesData.reduce((s,r)=>s+(parseInt(r.total_shops)||0),0), tk=routesData.reduce((s,r)=>s+(parseInt(r.total_km)||0),0);
  document.getElementById('routeStats').innerHTML=`
    <div class="stat"><div class="stat-n">${routesData.length}</div><div class="stat-l">Drivers</div></div>
    <div class="stat"><div class="stat-n">${ts}</div><div class="stat-l">Shops</div></div>
    <div class="stat"><div class="stat-n">${tk}</div><div class="stat-l">KM</div></div>`;
  if(!routesData.length){ el.innerHTML='<div style="text-align:center;padding:24px;font-size:13px;color:#8a7a6a;font-family:monospace">No routes.</div>'; return; }
  el.innerHTML=routesData.map(r=>{
    let sh=[]; try{ sh=JSON.parse(r.shop_order||'[]'); }catch(e){}
    return `<div class="driver-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-size:15px;font-weight:800">${r.driver}</div>
        <div style="display:flex;gap:4px"><span class="badge b-ok">${r.total_shops} shops</span><span class="badge b-warn">${r.total_km}km</span><span class="badge" style="background:#f3e8ff;color:#6e3da8">${r.est_time}</span></div>
      </div>
      <div style="font-size:10px;color:#8a7a6a;font-family:monospace;margin-bottom:6px">Started: ${r.start_time||'—'}</div>
      ${sh.map((s,j)=>`<div class="route-mini">${j+1}. ${s}</div>`).join('')}
    </div>`;
  }).join('');
}

// ── GPS ──
let gpsShops=[];
async function loadGPS(){ gpsShops=await api({action:'getShops'}); if(!Array.isArray(gpsShops)) gpsShops=[]; renderGPS(); }
function renderGPS(){
  const drv=document.getElementById('f-gps-driver').value, st=document.getElementById('f-gps-status').value;
  let list=gpsShops;
  if(drv) list=list.filter(s=>s.assigned_driver===drv);
  if(st==='saved') list=list.filter(s=>s.lat);
  if(st==='missing') list=list.filter(s=>!s.lat);
  const sv=gpsShops.filter(s=>s.lat).length;
  document.getElementById('gpsStats').innerHTML=`
    <div class="stat"><div class="stat-n">${gpsShops.length}</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-n" style="color:#2d7a4f">${sv}</div><div class="stat-l">Saved</div></div>
    <div class="stat"><div class="stat-n" style="color:#c8382a">${gpsShops.length-sv}</div><div class="stat-l">Missing</div></div>`;
  document.getElementById('gpsList').innerHTML=list.map(s=>`
    <div class="order-card">
      <div style="display:flex;justify-content:space-between">
        <div style="font-size:14px;font-weight:800;color:#4a2f14">${s.name}</div>
        <span class="badge ${s.lat?'b-ok':'b-miss'}">${s.lat?'✅ GPS':'⚠ No GPS'}</span>
      </div>
      <div style="font-size:10px;color:#8a7a6a;font-family:monospace;margin:3px 0 6px">${s.area||''} · <span class="badge DC-${s.assigned_driver||'Dinesh'}">${s.assigned_driver||'-'}</span></div>
      ${s.lat?`<div style="font-size:11px;font-family:monospace;color:#2d7a4f;margin-bottom:6px">${s.lat}, ${s.lng}</div><button class="btn-sm btn-map" onclick="window.open('https://www.google.com/maps?q=${s.lat},${s.lng}','_blank')">🗺 Map</button>`:''}
    </div>`).join('');
}

// ── EXPORTS ──
function exportRouteCSV(){ dlCSV([['Date','Driver','Start','Shops','KM','Est'],...routesData.map(r=>[r.date,r.driver,r.start_time||'',r.total_shops,r.total_km,r.est_time])],'routes-'+todayStr()+'.csv'); }
function exportGPSCSV(){ dlCSV([['Shop','Area','Driver','Lat','Lng'],...gpsShops.map(s=>[s.name,s.area,s.assigned_driver,s.lat||'',s.lng||''])],'gps-'+todayStr()+'.csv'); }
function dlCSV(rows,fn){ const csv=rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n'); const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download=fn; document.body.appendChild(a); a.click(); document.body.removeChild(a); }

loadOrders();
</script>
