<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5ede0;color:#1e1611;max-width:520px;margin:0 auto;min-height:100vh}
.topbar{background:#4a2f14;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99}
.topbar-title{color:#fff;font-size:15px;font-weight:800}
.topbar-sub{color:#c8a87a;font-size:11px;font-family:monospace}

.tbtn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 11px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:-apple-system,sans-serif;text-decoration:none;display:inline-block}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e8dfd2;position:sticky;top:53px;z-index:98;overflow-x:auto}
.tab{flex:1;min-width:70px;padding:11px 4px;border:none;background:none;font-size:11px;font-weight:700;cursor:pointer;color:#8a7a6a;font-family:-apple-system,sans-serif;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:#4a2f14;border-bottom-color:#4a2f14}
.page{display:none;padding:12px 14px 80px}.page.on{display:block}
.card{background:#fff;border:1.5px solid #e8dfd2;border-radius:16px;padding:14px;margin-bottom:10px}
.lbl{font-size:10px;letter-spacing:2px;color:#8a7a6a;font-family:monospace;font-weight:700;margin-bottom:8px;text-transform:uppercase}
select,input[type=text],input[type=date],input[type=password],textarea{width:100%;padding:11px 14px;border:1.5px solid #e8dfd2;border-radius:10px;font-size:14px;color:#1e1611;background:#f5ede0;outline:none;-webkit-appearance:none;font-family:-apple-system,sans-serif;margin-bottom:8px}

.filter-row{display:flex;gap:8px;margin-bottom:8px}.filter-row select,.filter-row input{margin-bottom:0}
.DC-Bharat{background:#fff3e0;color:#c8864a}.DC-Anand{background:#e3f2fd;color:#1a5fa8}.DC-Vikas{background:#e8f5e9;color:#2d7a4f}.DC-Yuvraj{background:#f3e8ff;color:#6e3da8}.DC-Rama{background:#fde8e8;color:#c8382a}.DC-Dinesh{background:#fce4ec;color:#880e4f}

.ai-loader{display:flex;align-items:center;gap:10px;padding:14px;background:#e8f0fe;border:1.5px solid #a8c7fa;border-radius:14px;margin-bottom:10px}
.ai-dot{width:8px;height:8px;background:#1a73e8;border-radius:50%;animation:pulse .8s infinite alternate}
.ai-dot:nth-child(2){animation-delay:.2s}.ai-dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%{opacity:.3;transform:scale(.8)}100%{opacity:1;transform:scale(1.2)}}
.ai-label{font-size:12px;font-weight:700;color:#1a73e8;font-family:monospace}
</style>

<script>
// ── ALL JS IN ONE BLOCK — no split scripts ──

var SHEET_API = 'https://script.google.com/macros/s/AKfycbyi-IJ6NLR28hRTeesy52THTbdcYCSnz3lp7NtEaJsxBOiNOm-9emMu0xOHT6hvWSE-/exec';
var GEMINI_KEY = 'AIzaSyBibBFw-030gXBDuk9jL0jQFbUYVBMNSjY';
var UNASSIGNED = 'Dinesh';

// guard
if(sessionStorage.getItem('role') !== 'admin') window.location.href = 'index.html';

function api(p){ return fetch(SHEET_API+'?'+new URLSearchParams(p)).then(function(r){return r.json();}).catch(function(){return [];}); }
function apiPost(b){ return fetch(SHEET_API,{method:'POST',body:JSON.stringify(b)}).then(function(r){return r.json();}).catch(function(){return {};}); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+zp(d.getMonth()+1)+'-'+zp(d.getDate()); }
function zp(n){ return String(n).padStart(2,'0'); }

// init dates
document.getElementById('topDate').textContent = new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'});
['ord-date','f-ord-date','f-rt-date','f-sum-date','f-del-date'].forEach(function(id){ document.getElementById(id).value = todayStr(); });

// button events
document.getElementById('logoutBtn').onclick     = function(){ sessionStorage.clear(); window.location.href='index.html'; };
document.getElementById('clearBtn').onclick      = function(){ document.getElementById('orderPaste').value=''; };
document.getElementById('parseBtn').onclick      = parseWithGemini;
document.getElementById('confirmBtn').onclick    = confirmAll;
document.getElementById('cancelBtn').onclick     = clearPreview;
document.getElementById('toggleBtn').onclick     = toggleAll;
document.getElementById('refreshOrdersBtn').onclick = loadOrders;
document.getElementById('refreshSumBtn').onclick = loadSummary;
document.getElementById('refreshDelBtn').onclick = loadDeliveries;
document.getElementById('refreshRtBtn').onclick  = loadRoutes;
document.getElementById('exportRtBtn').onclick   = exportRouteCSV;
document.getElementById('exportGpsBtn').onclick  = exportGPSCSV;
document.getElementById('f-ord-driver').onchange = loadOrders;
document.getElementById('f-ord-date').onchange   = loadOrders;
document.getElementById('f-sum-date').onchange   = loadSummary;
document.getElementById('f-del-driver').onchange = loadDeliveries;
document.getElementById('f-del-date').onchange   = loadDeliveries;
document.getElementById('f-rt-driver').onchange  = loadRoutes;
document.getElementById('f-rt-date').onchange    = loadRoutes;
document.getElementById('f-gps-driver').onchange = renderGPS;
document.getElementById('f-gps-status').onchange = renderGPS;

function showTab(t){
  ['orders','summary','delivery','routes','gps'].forEach(function(x){
    document.getElementById('pg-'+x).classList.toggle('on',x===t);
    document.getElementById('tb-'+x).classList.toggle('on',x===t);
  });
  if(t==='summary') loadSummary();
  if(t==='delivery') loadDeliveries();
  if(t==='routes') loadRoutes();
  if(t==='gps') loadGPS();
}

// ── SHOPS & FUZZY MATCH ──
var allShops = [], parsedOrders = [];

function loadShops(){
  return api({action:'getShops'}).then(function(d){ if(Array.isArray(d)) allShops=d; });
}
loadShops();

function nrm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ').trim(); }

function fuzzyMatch(name, area){
  var q=nrm(name), qa=nrm(area||'');
  var exact = allShops.filter(function(s){ return nrm(s.name)===q; });
  if(exact.length===1) return exact[0];
  if(exact.length>1){
    var areaMatch = exact.filter(function(s){ return qa && nrm(s.area||'').indexOf(qa)>=0; });
    if(areaMatch.length) return areaMatch[0];
    return exact[0];
  }
  var qw = q.split(' ').filter(function(w){ return w.length>1; });
  var best=null, bs=0;
  allShops.forEach(function(s){
    var sn=nrm(s.name), sa=nrm(s.area||'');
    var sc=0;
    qw.forEach(function(w){ if(sn.indexOf(w)>=0) sc+=w.length*2; });
    qa.split(' ').filter(function(w){return w.length>2;}).forEach(function(w){ if(sa.indexOf(w)>=0) sc+=w.length; });
    if(qa && sa===qa) sc+=5;
    if(sc>bs){bs=sc;best=s;}
  });
  return bs>=5 ? best : null;
}

// ── GEMINI CALL ──
function callGemini(text, attempt){
  attempt = attempt||1;
  var prompt = 'You are a bakery order parser for Its Baked bakery in Pune India.\n\nParse this WhatsApp order message. It may be original multiline WhatsApp or forwarded email with bold markers.\n\nRULES:\n1. Each shop block: SHOP NAME then AREA then DATE then ITEMS\n2. BREAD 5x5 or BUN 4 inch = CATEGORY HEADER: next short items belong to it. White-1 after BREAD 5x5 = White Bread 5x5. But Sweet Bun-4 is already full name.\n3. Specs like 4 inch EGG PLAIN MIX SEEDS WITHOUT MOULD describe the item above them\n4. Sub-brands like PJS Hospitality MILAS KITCHEN = skip\n5. Dates like 30.03.26 convert to YYYY-MM-DD\n6. Same shop at different areas = separate orders\n7. Skip: TOTAL COUNT Please send Morning Pick Up\n8. Ignore emoji for naming\n\nReturn ONLY a JSON array no markdown no explanation:\n[{"shop_name":"name","area":"location","date":"YYYY-MM-DD or empty","items":[{"name":"full item name with size","qty":number,"spec":"egg plain seeds etc or empty"}]}]\n\nMessage:\n'+text;

  return fetch(
    'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key='+GEMINI_KEY,
    {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{parts:[{text:prompt}]}],
        generationConfig:{temperature:0.1, responseMimeType:'application/json', maxOutputTokens:8192}
      })
    }
  ).then(function(res){
    if(!res.ok){
      return res.text().then(function(e){
        if(res.status===429){
          if(attempt<=3){
            var wait=attempt*20;
            document.getElementById('ai-label-text').textContent='Rate limit — retrying in '+wait+'s ('+attempt+'/3)...';
            return new Promise(function(resolve){ setTimeout(resolve, wait*1000); }).then(function(){ return callGemini(text, attempt+1); });
          }
          throw new Error('Rate limit — try again in 2 minutes');
        }
        if(res.status===404) throw new Error('Model not found — check Gemini model name');
        if(res.status===403) throw new Error('API key error 403 — check key at aistudio.google.com');
        throw new Error('Gemini error '+res.status);
      });
    }
    return res.json().then(function(data){
      var txt = (data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]&&data.candidates[0].content.parts[0].text)||'';
      if(!txt) throw new Error('Empty response from Gemini');
      var clean = txt.replace(/```json|```/g,'').trim();
      if(!clean.endsWith(']')){
        var lb = clean.lastIndexOf('}');
        if(lb>0) clean = clean.slice(0,lb+1)+']';
      }
      return JSON.parse(clean);
    });
  });
}

// ── PARSE WITH GEMINI ──
function parseWithGemini(){
  var raw = document.getElementById('orderPaste').value.trim();
  var pmsg = document.getElementById('parse-msg');
  var loader = document.getElementById('ai-loading');
  var btn = document.getElementById('parseBtn');
  if(!raw){ pmsg.textContent='Paste order text first'; pmsg.className='msg er'; pmsg.style.display='block'; return; }
  if(!allShops.length){ loadShops().then(function(){ parseWithGemini(); }); return; }

  btn.disabled=true; btn.textContent='Parsing... keep screen on';
  loader.style.display='flex'; pmsg.style.display='none';
  document.getElementById('ai-label-text').textContent='Gemini is reading orders...';

  callGemini(raw).then(function(aiOrders){
    if(!Array.isArray(aiOrders)||!aiOrders.length) throw new Error('No orders found');
    processOrders(aiOrders);
  }).catch(function(err){
    console.error(err);
    // fallback to built-in parser
    if(err.message.indexOf('Rate limit')>=0 || err.message.indexOf('fetch')>=0 || err.message.indexOf('403')>=0 || err.message.indexOf('404')>=0){
      pmsg.textContent='Gemini busy — using built-in parser...';
      pmsg.className='msg warn'; pmsg.style.display='block';
      var fb = parseBuiltin(raw);
      if(fb.length){ processOrders(fb); }
      else { pmsg.textContent='Could not parse. Check message format.'; pmsg.className='msg er'; }
    } else {
      pmsg.textContent='Error: '+err.message;
      pmsg.className='msg er'; pmsg.style.display='block';
    }
  }).finally(function(){
    btn.disabled=false; btn.textContent='Parse with Gemini AI';
    loader.style.display='none';
  });
}

// ── PROCESS ORDERS ──
function processOrders(aiOrders){
  parsedOrders=[];
  var matched=0, unmatched=0, totalItems=0;
  aiOrders.forEach(function(o){
    var shop = fuzzyMatch(o.shop_name||'', o.area||'');
    var items = (o.items||[]).map(function(it){ return {name:it.name||'?', qty:parseInt(it.qty)||0, spec:it.spec||''}; });
    totalItems += items.length;
    parsedOrders.push({
      shop_id: shop?shop.shop_id:'',
      shop_name: shop?shop.name:(o.shop_name||'?'),
      area: shop?(shop.area||o.area||''):(o.area||''),
      driver: shop?(shop.assigned_driver||UNASSIGNED):UNASSIGNED,
      items:items, date:o.date||'', matched:!!shop, raw_name:o.shop_name||''
    });
    shop?matched++:unmatched++;
  });
  document.getElementById('parseStatsBox').style.display='block';
  document.getElementById('parseStats').innerHTML =
    '<div class="ps"><div class="ps-n">'+parsedOrders.length+'</div><div class="ps-l">Shops</div></div>'+
    '<div class="ps"><div class="ps-n" style="color:#2d7a4f">'+matched+'</div><div class="ps-l">Matched</div></div>'+
    '<div class="ps"><div class="ps-n" style="color:#c8382a">'+unmatched+'</div><div class="ps-l">New</div></div>'+
    '<div class="ps"><div class="ps-n" style="color:#1a73e8">'+totalItems+'</div><div class="ps-l">Items</div></div>';
  var pmsg=document.getElementById('parse-msg');
  pmsg.textContent='Parsed '+parsedOrders.length+' shops. '+matched+' matched. '+unmatched+' new to Dinesh.';
  pmsg.className='msg ok'; pmsg.style.display='block';
  renderPreview();
}

// ── BUILT-IN FALLBACK PARSER ──
function parseBuiltin(raw){
  var KW_ITEM=['white bread','brown bread','multigrain bread','white bun','brown bun','sweet bun','brioche bun','milk bun','mg bun','hot dog','slider','white pizza','brown pizza','pita bread','pita','garlic bread','french loaf','sub','brota','veg puff','paneer puff','chicken puff'];
  var KW_SIZE=['5x5','4x4','6x3','8x3','4x3','4 inch','4.5 inch','5 inch','6 inch','7 inch','8 inch','9 inch','10 inch','12 inch','3 inch','2.5 inch','80 gm','100 gm','120 gm','small ring','big ring'];
  var KW_NOTE=['mix seeds','white seeds','without mould','without ring','deck oven','heart shape','egg','plain','thick','thin','wheat'];
  var KW_SKIP=['please','send','morning','pick up','pickup','total count','pjs hospitality','milas kitchen'];
  function esc(w){return w.replace(/[-\/\\^$+?.()|[\]{}]/g,'\\$&');}
  function mkRE(a,ex){
    var e=a.slice().sort(function(x,y){return y.length-x.length;}).map(esc);
    return ex?new RegExp('^('+e.join('|')+')$','i'):new RegExp('('+e.join('|')+')','i');
  }
  var ITEM_RE=mkRE(KW_ITEM,false), SIZE_RE=mkRE(KW_SIZE,true), NOTE_RE=mkRE(KW_NOTE,true), SKIP_RE=mkRE(KW_SKIP,false);
  var DATE_RE=/\b\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4}\b/, QTY_RE=/[-\u2013]\s*\d+/;
  function fmtDate(s){
    var m=s.match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/);
    if(!m)return '';
    var y=m[3]; if(y.length===2) y='20'+y;
    return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  }
  var text=raw
    .replace(/\[\d{1,2}:\d{2}\s*[AP]M,\s*\d{1,2}\/\d{1,2}\/\d{4}\]\s*[^:]+:\s*/gi,'\n')
    .replace(/[^\x00-\x7F\n]/g,' ')
    .replace(/\*([^*\n]+)\*/g,'\n$1\n')
    .replace(/^[.\-\s]+/gm,'')
    .replace(/\n{3,}/g,'\n\n');
  var results=[];
  text.split(/\n\s*\n/).forEach(function(b){
    var lines=b.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.length>0;});
    if(!lines.length) return;
    var name='',loc='',date='',items=[],prefix='',pendingSize='';
    var itemStart=-1;
    for(var ii=0;ii<lines.length;ii++){ if(QTY_RE.test(lines[ii])){itemStart=ii;break;} }
    var hEnd=itemStart<0?Math.min(4,lines.length):Math.min(itemStart,4);
    lines.slice(0,hEnd).forEach(function(l){
      var c=l.replace(/\s+/g,' ').trim();
      if(!c||SKIP_RE.test(c)) return;
      if(DATE_RE.test(c)&&!ITEM_RE.test(c)){if(!date){var dm=c.match(DATE_RE);if(dm)date=fmtDate(dm[0]);}return;}
      if(SIZE_RE.test(c)||NOTE_RE.test(c)) return;
      if(!name){name=c;return;}
      if(!date) loc=loc?loc+' '+c:c;
    });
    if(!name||/total count/i.test(name)) return;
    if(itemStart>=0){
      lines.slice(itemStart).forEach(function(l){
        var c=l.replace(/\s+/g,' ').trim();
        if(!c||SKIP_RE.test(c)) return;
        if(DATE_RE.test(c)&&!ITEM_RE.test(c)&&!QTY_RE.test(c)){if(!date){var dm=c.match(DATE_RE);if(dm)date=fmtDate(dm[0]);}return;}
        if(SIZE_RE.test(c)){
          if(items.length>0){var last=items[items.length-1];if(last.name.toLowerCase().indexOf(c.toLowerCase())<0)last.name+=' '+c;}
          else pendingSize=c; return;
        }
        if(NOTE_RE.test(c)){if(items.length>0){var last2=items[items.length-1];last2.spec=last2.spec?last2.spec+' '+c:c;}return;}
        if(ITEM_RE.test(c)&&!QTY_RE.test(c)){prefix=c;pendingSize='';return;}
        if(QTY_RE.test(c)){
          var im=c.match(/^([a-zA-Z][a-zA-Z\s'.()&]{0,40}?)\s*[-\u2013]\s*(\d+)\s*(.{0,40})$/);
          if(im&&+im[2]>0&&+im[2]<10000){
            var nm=im[1].trim();
            if(prefix&&nm.split(' ').length<=2&&!ITEM_RE.test(nm)){nm=nm+' '+prefix;}else{prefix='';}
            if(pendingSize&&nm.toLowerCase().indexOf(pendingSize.toLowerCase())<0){nm+=' '+pendingSize;pendingSize='';}
            items.push({name:nm,qty:+im[2],spec:im[3].replace(/\*/g,'').trim()});
          }
        }
      });
    }
    if(name) results.push({shop_name:name,area:loc,date:date,items:items});
  });
  return results;
}

// ── PREVIEW ──
var collapsed=false;
function toggleAll(){ collapsed=!collapsed; document.querySelectorAll('.parsed-item').forEach(function(el){el.classList.toggle('collapsed',collapsed);}); }
function clearPreview(){ document.getElementById('previewBox').style.display='none'; document.getElementById('parseStatsBox').style.display='none'; parsedOrders=[]; }

function renderPreview(){
  document.getElementById('previewBox').style.display='block';
  document.getElementById('previewTitle').textContent='Preview - '+parsedOrders.length+' Orders';
  var unm=parsedOrders.filter(function(o){return !o.matched;});
  var pw=document.getElementById('preview-warn');
  if(unm.length){pw.textContent='New shops to Dinesh:\n'+unm.map(function(o){return o.raw_name;}).join(', ');pw.style.display='block';}
  else{pw.style.display='none';}
  document.getElementById('previewList').innerHTML=parsedOrders.map(function(o,i){
    var tags=o.items.map(function(it){return '<span class="itag"><b>'+it.qty+'x</b> '+it.name+(it.spec?' <span style="color:#8a7a6a">('+it.spec+')</span>':'')+' </span>';}).join('');
    var dsel='<select onchange="parsedOrders['+i+'].driver=this.value" style="padding:5px 10px;font-size:12px;background:#f5ede0;border:1px solid #e8dfd2;border-radius:6px;flex:1">'+
      ['Dinesh','Bharat','Anand','Vikas','Yuvraj','Rama'].map(function(d){return '<option '+(o.driver===d?'selected':'')+'>'+d+'</option>';}).join('')+'</select>';
    return '<div class="parsed-item '+(o.matched?'':'unmatched')+'" id="pi-'+i+'">'+
      '<div class="pi-head" onclick="document.getElementById(\'pi-'+i+'\').classList.toggle(\'collapsed\')">'+
      '<div><div style="font-size:14px;font-weight:800;color:#4a2f14">'+o.shop_name+'</div>'+
      '<div style="font-size:10px;color:#8a7a6a;font-family:monospace;margin-top:2px">'+o.area+' · '+(o.matched?'OK':'NEW')+' · '+o.items.length+' items · '+(o.date||'no date')+'</div></div>'+
      '<div style="display:flex;align-items:center;gap:6px"><span class="badge DC-'+o.driver+'">'+o.driver+'</span><span class="pi-toggle">v</span></div></div>'+
      '<div class="pi-body" style="margin-top:8px"><div style="margin-bottom:6px">'+(tags||'<span style="color:#c8382a;font-size:11px">No items</span>')+'</div>'+
      (!o.matched?'<div style="display:flex;gap:8px;align-items:center;margin-top:6px"><span style="font-size:11px;color:#8a7a6a">Reassign:</span>'+dsel+'</div>':'')+
      '</div></div>';
  }).join('');
  document.getElementById('previewBox').scrollIntoView({behavior:'smooth',block:'start'});
}

// ── CONFIRM ──
function confirmAll(){
  var btn=document.getElementById('confirmBtn'); btn.textContent='Saving...'; btn.disabled=true;
  var dateInput=document.getElementById('ord-date').value||todayStr();
  var ok=0,fail=0;
  var chain=Promise.resolve();
  parsedOrders.forEach(function(o){
    chain=chain.then(function(){
      return apiPost({action:'addOrder',driver:o.driver,shop_id:o.shop_id,shop_name:o.shop_name,
        items:o.items.map(function(it){return it.name+(it.spec?' ('+it.spec+')':'');}).join(', '),
        qty:o.items.map(function(it){return it.qty;}).join(', '),
        note:o.matched?'':'NEW SHOP - '+o.area,
        date:o.date||dateInput
      }).then(function(res){ res&&res.ok?ok++:fail++; });
    });
  });
  chain.then(function(){
    btn.textContent='Confirm and Save All'; btn.disabled=false;
    var pmsg=document.getElementById('parse-msg');
    pmsg.textContent=ok+' saved!'+(fail?' '+fail+' failed.':'');
    pmsg.className='msg ok'; pmsg.style.display='block';
    clearPreview(); loadOrders();
  });
}

// ── ORDERS ──
function loadOrders(){
  var el=document.getElementById('ordersList');
  el.innerHTML='<div style="text-align:center;padding:16px;font-size:12px;color:#8a7a6a;font-family:monospace">Loading...</div>';
  api({action:'getOrders',driver:document.getElementById('f-ord-driver').value,date:document.getElementById('f-ord-date').value||todayStr()})
  .then(function(data){
    if(!Array.isArray(data)||!data.length){el.innerHTML='<div style="text-align:center;padding:24px;font-size:13px;color:#8a7a6a;font-family:monospace">No orders.</div>';return;}
    el.innerHTML=data.map(function(o){
      return '<div class="order-card">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
        '<div style="font-size:14px;font-weight:800;color:#4a2f14">'+o.shop_name+'</div>'+
        '<span class="badge DC-'+o.driver+'">'+o.driver+'</span></div>'+
        '<div style="font-size:10px;color:#8a7a6a;font-family:monospace;margin:3px 0 6px">'+o.date+' · '+o.order_id+'</div>'+
        '<div style="font-size:12px;font-family:monospace;background:#f5ede0;padding:7px 10px;border-radius:8px;margin-bottom:7px">'+
        '<b>Items:</b> '+o.items+'<br><b>Qty:</b> '+o.qty+(o.note&&o.note!='—'?'<br><b>Note:</b> '+o.note:'')+'</div>'+
        '<button class="btn-sm btn-del" onclick="deleteOrder(\''+o.order_id+'\')">Delete</button></div>';
    }).join('');
  });
}
function deleteOrder(id){ if(!confirm('Delete?'))return; apiPost({action:'deleteOrder',order_id:id}).then(loadOrders); }

// ── SUMMARY ──
function loadSummary(){
  var el=document.getElementById('summaryBody');
  el.innerHTML='<div style="text-align:center;padding:16px;font-size:12px;color:#8a7a6a;font-family:monospace">Loading...</div>';
  api({action:'getOrders',date:document.getElementById('f-sum-date').value||todayStr()}).then(function(data){
    if(!Array.isArray(data)||!data.length){el.innerHTML='<div style="text-align:center;padding:24px;font-size:13px;color:#8a7a6a;font-family:monospace">No orders.</div>';return;}
    var byD={};
    data.forEach(function(o){if(!byD[o.driver])byD[o.driver]=[];byD[o.driver].push(o);});
    var aI={};
    data.forEach(function(o){(o.items||'').split(',').map(function(s){return s.trim();}).filter(Boolean).forEach(function(item){aI[item]=(aI[item]||0)+1;});});
    var h='<div class="card" style="margin-bottom:10px"><div class="lbl">Grand Total</div>'+
      '<div style="font-size:13px;font-weight:800;color:#4a2f14;margin-bottom:6px">'+data.length+' orders · '+Object.keys(byD).length+' drivers</div>'+
      Object.entries(aI).map(function(e){return '<div class="summary-row">'+e[0]+': <b>'+e[1]+'</b></div>';}).join('')+'</div>';
    Object.entries(byD).forEach(function(e){
      var drv=e[0],ords=e[1],dI={};
      ords.forEach(function(o){(o.items||'').split(',').map(function(s){return s.trim();}).filter(Boolean).forEach(function(item){dI[item]=(dI[item]||0)+1;});});
      h+='<div class="summary-card"><div style="font-size:15px;font-weight:800;margin-bottom:6px"><span class="badge DC-'+drv+'">'+drv+'</span> · '+ords.length+' shops</div>'+
        ords.map(function(o){return '<div class="summary-row">* '+o.shop_name+' - '+o.items+' ('+o.qty+')</div>';}).join('')+
        '<div style="font-size:13px;font-weight:800;color:#4a2f14;padding-top:6px;border-top:1px solid #f0e8dc">'+
        Object.entries(dI).map(function(e){return e[0]+' x'+e[1];}).join(', ')+'</div></div>';
    });
    el.innerHTML=h;
  });
}

// ── DELIVERY ──
function loadDeliveries(){
  var el=document.getElementById('deliveryList');
  el.innerHTML='<div style="text-align:center;padding:16px;font-size:12px;color:#8a7a6a;font-family:monospace">Loading...</div>';
  var drv=document.getElementById('f-del-driver').value, dt=document.getElementById('f-del-date').value||todayStr();
  Promise.all([api({action:'getOrders',driver:drv,date:dt}),api({action:'getDeliveries',driver:drv,date:dt}),api({action:'getRoutes',driver:drv,date:dt})])
  .then(function(results){
    var ords=Array.isArray(results[0])?results[0]:[], dels=Array.isArray(results[1])?results[1]:[], rts=Array.isArray(results[2])?results[2]:[];
    var dM={};dels.forEach(function(d){dM[d.shop_id]=d;});
    document.getElementById('delivStats').innerHTML=
      '<div class="stat"><div class="stat-n">'+ords.length+'</div><div class="stat-l">Total</div></div>'+
      '<div class="stat"><div class="stat-n" style="color:#2d7a4f">'+dels.length+'</div><div class="stat-l">Done</div></div>'+
      '<div class="stat"><div class="stat-n" style="color:#c8382a">'+(ords.length-dels.length)+'</div><div class="stat-l">Pending</div></div>';
    if(!ords.length){el.innerHTML='<div style="text-align:center;padding:24px;font-size:13px;color:#8a7a6a;font-family:monospace">No orders.</div>';return;}
    var ri='';
    if(rts.length) ri='<div class="card" style="margin-bottom:10px"><div class="lbl">Routes</div>'+rts.map(function(r){return '<div style="font-size:12px;font-family:monospace;padding:3px 0"><span class="badge DC-'+r.driver+'">'+r.driver+'</span> '+( r.start_time||'not started')+' · '+(r.total_shops||'?')+' shops</div>';}).join('')+'</div>';
    el.innerHTML=ri+ords.map(function(o){
      var dn=!!dM[o.shop_id];
      return '<div class="deliv-row"><div style="flex:1">'+
        '<div style="font-size:13px;font-weight:800">'+o.shop_name+'</div>'+
        '<div style="font-size:10px;color:#8a7a6a;font-family:monospace;margin-top:2px"><span class="badge DC-'+o.driver+'">'+o.driver+'</span> · '+o.items+'</div>'+
        (dn?'<div style="font-size:10px;font-family:monospace;color:#2d7a4f;margin-top:2px">Done '+(dM[o.shop_id].time||'')+'</div>':'')+
        '</div><span class="badge '+(dn?'b-done':'b-miss')+'">'+(dn?'Done':'Pending')+'</span></div>';
    }).join('');
  });
}

// ── ROUTES ──
var routesData=[];
function loadRoutes(){
  var el=document.getElementById('routesList');
  el.innerHTML='<div style="text-align:center;padding:16px;font-size:12px;color:#8a7a6a;font-family:monospace">Loading...</div>';
  api({action:'getRoutes',date:document.getElementById('f-rt-date').value||todayStr(),driver:document.getElementById('f-rt-driver').value})
  .then(function(data){
    routesData=Array.isArray(data)?data:[];
    var ts=routesData.reduce(function(s,r){return s+(parseInt(r.total_shops)||0);},0);
    var tk=routesData.reduce(function(s,r){return s+(parseInt(r.total_km)||0);},0);
    document.getElementById('routeStats').innerHTML=
      '<div class="stat"><div class="stat-n">'+routesData.length+'</div><div class="stat-l">Drivers</div></div>'+
      '<div class="stat"><div class="stat-n">'+ts+'</div><div class="stat-l">Shops</div></div>'+
      '<div class="stat"><div class="stat-n">'+tk+'</div><div class="stat-l">KM</div></div>';
    if(!routesData.length){el.innerHTML='<div style="text-align:center;padding:24px;font-size:13px;color:#8a7a6a;font-family:monospace">No routes.</div>';return;}
    el.innerHTML=routesData.map(function(r){
      var sh=[]; try{sh=JSON.parse(r.shop_order||'[]');}catch(e){}
      return '<div class="driver-card">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
        '<div style="font-size:15px;font-weight:800">'+r.driver+'</div>'+
        '<div style="display:flex;gap:4px"><span class="badge b-ok">'+r.total_shops+' shops</span><span class="badge b-warn">'+r.total_km+'km</span></div></div>'+
        '<div style="font-size:10px;color:#8a7a6a;font-family:monospace;margin-bottom:6px">Started: '+(r.start_time||'not started')+'</div>'+
        sh.map(function(s,j){return '<div class="route-mini">'+(j+1)+'. '+s+'</div>';}).join('')+'</div>';
    }).join('');
  });
}

// ── GPS ──
var gpsShops=[];
function loadGPS(){ api({action:'getShops'}).then(function(d){ gpsShops=Array.isArray(d)?d:[]; renderGPS(); }); }
function renderGPS(){
  var drv=document.getElementById('f-gps-driver').value, st=document.getElementById('f-gps-status').value;
  var list=gpsShops;
  if(drv) list=list.filter(function(s){return s.assigned_driver===drv;});
  if(st==='saved') list=list.filter(function(s){return s.lat;});
  if(st==='missing') list=list.filter(function(s){return !s.lat;});
  var sv=gpsShops.filter(function(s){return s.lat;}).length;
  document.getElementById('gpsStats').innerHTML=
    '<div class="stat"><div class="stat-n">'+gpsShops.length+'</div><div class="stat-l">Total</div></div>'+
    '<div class="stat"><div class="stat-n" style="color:#2d7a4f">'+sv+'</div><div class="stat-l">Saved</div></div>'+
    '<div class="stat"><div class="stat-n" style="color:#c8382a">'+(gpsShops.length-sv)+'</div><div class="stat-l">Missing</div></div>';
  document.getElementById('gpsList').innerHTML=list.map(function(s){
    return '<div class="order-card">'+
      '<div style="display:flex;justify-content:space-between">'+
      '<div style="font-size:14px;font-weight:800;color:#4a2f14">'+s.name+'</div>'+
      '<span class="badge '+(s.lat?'b-ok':'b-miss')+'">'+(s.lat?'GPS':'No GPS')+'</span></div>'+
      '<div style="font-size:10px;color:#8a7a6a;font-family:monospace;margin:3px 0 6px">'+(s.area||'')+' · <span class="badge DC-'+(s.assigned_driver||'Dinesh')+'">'+(s.assigned_driver||'-')+'</span></div>'+
      (s.lat?'<div style="font-size:11px;font-family:monospace;color:#2d7a4f;margin-bottom:6px">'+s.lat+', '+s.lng+'</div><button class="btn-sm btn-map" onclick="window.open(\'https://www.google.com/maps?q='+s.lat+','+s.lng+'\',\'_blank\')">Map</button>':'')+
      '</div>';
  }).join('');
}

// ── EXPORTS ──
function exportRouteCSV(){ dlCSV([['Date','Driver','Start','Shops','KM','Est']].concat(routesData.map(function(r){return [r.date,r.driver,r.start_time||'',r.total_shops,r.total_km,r.est_time];})),'routes-'+todayStr()+'.csv'); }
function exportGPSCSV(){ dlCSV([['Shop','Area','Driver','Lat','Lng']].concat(gpsShops.map(function(s){return [s.name,s.area,s.assigned_driver,s.lat||'',s.lng||''];})),'gps-'+todayStr()+'.csv'); }
function dlCSV(rows,fn){ var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c||'').replace(/"/g,'""')+'"';}).join(',');}).join('\n'); var a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download=fn; document.body.appendChild(a); a.click(); document.body.removeChild(a); }
