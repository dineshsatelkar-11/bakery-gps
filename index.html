<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>It's Baked</title>
<script src="config.js"></script>
<script src="api.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a2f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baked GPS">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5ede0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo{font-size:56px;margin-bottom:6px;text-align:center}
h1{font-size:24px;font-weight:900;color:#4a2f14;text-align:center}
.sub{font-size:12px;color:#8a7a6a;font-family:monospace;text-align:center;margin-bottom:32px;margin-top:3px}
.card{background:#fff;border:1.5px solid #e8dfd2;border-radius:20px;padding:24px;width:100%;max-width:360px}
.lbl{font-size:10px;letter-spacing:2px;color:#8a7a6a;font-family:monospace;font-weight:700;margin-bottom:8px;text-transform:uppercase;display:block}
input{width:100%;padding:14px;border:1.5px solid #e8dfd2;border-radius:12px;font-size:15px;font-weight:600;color:#1e1611;background:#f5ede0;outline:none;-webkit-appearance:none;font-family:-apple-system,sans-serif;margin-bottom:12px;transition:border-color .2s}
input:focus{border-color:#e67e22}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:-apple-system,sans-serif;background:#4a2f14;color:#fff;transition:opacity .2s}
.btn:disabled{opacity:.6;cursor:not-allowed}
.err{color:#c8382a;font-size:12px;font-family:monospace;text-align:center;margin-top:10px;display:none;line-height:1.6}
.hint{font-size:11px;color:#8a7a6a;font-family:monospace;text-align:center;margin-top:14px;line-height:1.8}
.hint span{color:#4a2f14;font-weight:700}
.checking{color:#1565c0;font-size:12px;font-family:monospace;text-align:center;margin-top:10px;display:none}
</style>
</head>
<body>

<div class="logo">🥖</div>
<h1>It's Baked</h1>
<div class="sub">Delivery Management · Lohegaon</div>

<div class="card">
  <label class="lbl">Name / Username / Mobile</label>
  <input type="text" id="loginId" placeholder="Enter your name or username" autocomplete="off" autocorrect="off" autocapitalize="off">
  <label class="lbl">Password</label>
  <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
  <button class="btn" id="loginBtn" onclick="doLogin()">🔑 Login</button>
  <div class="checking" id="checkingMsg"></div>
  <div class="err" id="errMsg">Wrong name / username / password.<br>Please check and try again.</div>
</div>

<div class="hint">
  Staff · Driver · Customer — <span>one login for all</span>
</div>

<script>
// Register Service Worker
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(function(){});
  });
}

// Load staff + driver names for datalist autocomplete and case-insensitive matching
var staffNames  = [];
var driverNames = [];

// namesReady resolves once both lists are fetched — doLogin waits for this
var namesReady = Promise.all([
  api({action:'getStaff'}).then(function(data){
    staffNames = (Array.isArray(data)?data:[]).filter(function(s){return s.active;}).map(function(s){return s.name;});
  }),
  api({action:'getDrivers'}).then(function(data){
    driverNames = (Array.isArray(data)?data:[]).filter(function(d){return d.active;}).map(function(d){return d.name;});
  })
]);

// Find exact DB name with case-insensitive + trimmed match
function exactName(input, list){
  var q = input.trim().toLowerCase();
  return list.find(function(n){ return n.trim().toLowerCase() === q; }) || null;
}

var loginId   = document.getElementById('loginId');
var loginPass = document.getElementById('loginPass');
var loginBtn  = document.getElementById('loginBtn');
var errMsg    = document.getElementById('errMsg');
var checkMsg  = document.getElementById('checkingMsg');

loginPass.addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
loginId.addEventListener('keydown',function(e){ if(e.key==='Enter') loginPass.focus(); });

function setChecking(msg){
  errMsg.style.display='none';
  checkMsg.textContent=msg;
  checkMsg.style.display=msg?'block':'none';
}

function doLogin(){
  var id   = loginId.value.trim();
  var pass = loginPass.value.trim();
  if(!id){ loginId.focus(); return; }
  if(!pass){ loginPass.focus(); return; }

  loginBtn.disabled=true;
  errMsg.style.display='none';
  setChecking('⏳ Checking…');

  // Wait for names to load (instant if already done), then resolve exact casing
  namesReady.then(function(){
  var staffExact  = exactName(id, staffNames);
  var driverExact = exactName(id, driverNames);

  // Step 1: Try staff login (use exact DB name if found, else trimmed input)
  api({action:'staffLogin', name:staffExact||id, password:pass}).then(function(data){
    var s = Array.isArray(data)&&data.length ? data[0] : null;
    if(s && s.role){
      sessionStorage.setItem('role', s.role);
      sessionStorage.setItem('tabs', s.tabs||'[]');
      sessionStorage.setItem('staffName', s.name);
      localStorage.setItem('staffRole', s.role);
      localStorage.setItem('staffTabs', s.tabs||'[]');
      localStorage.setItem('staffNamePersist', s.name);
      if(s.role==='chef'){
        localStorage.setItem('kitchenStaff', s.name);
        goto('kitchen');
      } else if(s.role==='packer'){
        localStorage.setItem('packStaff', s.name);
        goto('packaging');
      } else {
        goto('admin');
      }
      return;
    }

    // Step 2: Try driver login
    return api({action:'driverLogin', name:driverExact||id, password:pass}).then(function(data){
      var d = Array.isArray(data)&&data.length ? data[0] : null;
      if(d && d.name){
        sessionStorage.setItem('role','driver');
        sessionStorage.setItem('driver', d.name);
        localStorage.setItem('driverRole','driver');
        localStorage.setItem('driverName', d.name);
        goto('driver');
        return;
      }

      // Step 3: Try customer login (username or mobile — RPC already does LOWER+TRIM)
      return api({action:'customerLogin', username:id, password:pass}).then(function(data){
        var c = Array.isArray(data)&&data.length ? data[0] : null;
        if(c && c.shop_id){
          // Write full session to localStorage so order.html auto-restore picks it up correctly
          localStorage.setItem('custSession', JSON.stringify(c));
          goto('order');
          return;
        }

        // All failed
        loginBtn.disabled=false;
        setChecking('');
        errMsg.style.display='block';
      });
    });
  }).catch(function(){
    loginBtn.disabled=false;
    setChecking('');
    errMsg.style.display='block';
  });
  }); // end namesReady.then
}

function goto(page){
  setChecking('✅ Logged in! Opening…');
  window.location.href = page + '.html';
}

// ── Auto-restore session ──
(function(){
  var _r = sessionStorage.getItem('role');

  // Restore driver
  if(!_r && localStorage.getItem('driverRole')==='driver'){
    sessionStorage.setItem('role','driver');
    sessionStorage.setItem('driver', localStorage.getItem('driverName'));
    _r='driver';
  }
  // Restore staff
  if(!_r && localStorage.getItem('staffRole')){
    var sr=localStorage.getItem('staffRole');
    sessionStorage.setItem('role', sr);
    sessionStorage.setItem('tabs', localStorage.getItem('staffTabs')||'[]');
    sessionStorage.setItem('staffName', localStorage.getItem('staffNamePersist')||'');
    _r=sr;
  }

  if(_r==='driver')    goto('driver');
  if(_r==='chef')      goto('kitchen');
  if(_r==='packer')    goto('packaging');
  if(_r==='super_admin'||_r==='admin'||_r==='assistant') goto('admin');
  // Note: customer sessions are not auto-restored (they must login each time for security)
})();
</script>
</body>
</html>
