<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Baked GPS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5ede0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo{font-size:56px;margin-bottom:8px;text-align:center}
h1{font-size:26px;font-weight:900;color:#4a2f14;text-align:center}
.sub{font-size:12px;color:#8a7a6a;font-family:monospace;text-align:center;margin-bottom:32px}
.card{background:#fff;border:1.5px solid #e8dfd2;border-radius:20px;padding:24px;width:100%;max-width:360px;margin-bottom:14px}
.lbl{font-size:10px;letter-spacing:2px;color:#8a7a6a;font-family:monospace;font-weight:700;margin-bottom:8px;text-transform:uppercase}
select,input{width:100%;padding:14px;border:1.5px solid #e8dfd2;border-radius:12px;font-size:15px;font-weight:600;color:#1e1611;background:#f5ede0;outline:none;-webkit-appearance:none;font-family:-apple-system,sans-serif;margin-bottom:12px}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:-apple-system,sans-serif}
.btn-driver{background:#2d7a4f;color:#fff}
.btn-admin{background:#4a2f14;color:#fff}
.err{color:#c8382a;font-size:12px;font-family:monospace;text-align:center;margin-top:8px;display:none}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:#8a7a6a;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e8dfd2}
</style>
</head>
<body>
<div class="logo">🥖</div>
<h1>Baked GPS</h1>
<div class="sub">Delivery Management · Lohegaon</div>

<div class="card">
  <div class="lbl">Driver Login</div>
  <select id="driverName">
    <option value="">Select your name…</option>
    <option>Bharat</option><option>Anand</option><option>Vikas</option>
    <option>Yuvraj</option><option>Rama</option>
  </select>
  <input type="password" id="driverPass" placeholder="Password">
  <button class="btn btn-driver" onclick="driverLogin()">🚗 Driver Login</button>
  <div class="err" id="d-err">Wrong password. Try again.</div>
</div>

<div class="divider">or</div>

<div class="card">
  <div class="lbl">Admin Login</div>
  <input type="password" id="adminPass" placeholder="Admin password">
  <button class="btn btn-admin" onclick="adminLogin()">📊 Admin Login</button>
  <div class="err" id="a-err">Wrong password. Try again.</div>
</div>

<script>
// Driver passwords (simple, change as needed)
const DRIVER_PASS = { Bharat:'bharat123', Anand:'anand123', Vikas:'vikas123', Yuvraj:'yuvraj123', Rama:'rama123' };
const ADMIN_PASS = 'baked@admin';

function driverLogin() {
  const name = document.getElementById('driverName').value;
  const pass = document.getElementById('driverPass').value;
  if (!name) { alert('Select your name'); return; }
  if (pass !== DRIVER_PASS[name]) { document.getElementById('d-err').style.display='block'; return; }
  sessionStorage.setItem('role','driver');
  sessionStorage.setItem('driver', name);
  window.location.href = 'driver.html';
}

function adminLogin() {
  const pass = document.getElementById('adminPass').value;
  if (pass !== ADMIN_PASS) { document.getElementById('a-err').style.display='block'; return; }
  sessionStorage.setItem('role','admin');
  window.location.href = 'admin.html';
}

// Press Enter to login
document.getElementById('driverPass').addEventListener('keydown', e => { if(e.key==='Enter') driverLogin(); });
document.getElementById('adminPass').addEventListener('keydown', e => { if(e.key==='Enter') adminLogin(); });

// Redirect if already logged in
if (sessionStorage.getItem('role')==='driver') window.location.href='driver.html';
if (sessionStorage.getItem('role')==='admin') window.location.href='admin.html';
</script>
</body>
</html>
