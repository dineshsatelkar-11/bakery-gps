<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Baked GPS</title>
<script src="config.js"></script>
<script src="api.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a2f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baked GPS">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5ede0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo{font-size:52px;margin-bottom:6px;text-align:center}
h1{font-size:24px;font-weight:900;color:#4a2f14;text-align:center}
.sub{font-size:12px;color:#8a7a6a;font-family:monospace;text-align:center;margin-bottom:28px;margin-top:2px}
.card{background:#fff;border:1.5px solid #e8dfd2;border-radius:20px;padding:22px;width:100%;max-width:360px;margin-bottom:12px}
.lbl{font-size:10px;letter-spacing:2px;color:#8a7a6a;font-family:monospace;font-weight:700;margin-bottom:8px;text-transform:uppercase}
select,input{width:100%;padding:13px;border:1.5px solid #e8dfd2;border-radius:12px;font-size:15px;font-weight:600;color:#1e1611;background:#f5ede0;outline:none;-webkit-appearance:none;font-family:-apple-system,sans-serif;margin-bottom:10px}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:-apple-system,sans-serif}
.btn-driver{background:#2d7a4f;color:#fff;margin-bottom:0}
.btn-admin{background:#4a2f14;color:#fff;margin-bottom:0}
.err{color:#c8382a;font-size:12px;font-family:monospace;text-align:center;margin-top:8px;display:none}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:#8a7a6a;font-size:12px;width:100%;max-width:360px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e8dfd2}
.lang-row{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.lang-btn{padding:7px 18px;border-radius:20px;border:1.5px solid #e8dfd2;background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:#8a7a6a;font-family:-apple-system,sans-serif}
.lang-btn.on{background:#4a2f14;color:#fff;border-color:#4a2f14}
</style>
</head>
<body>
<div class="logo">🥖</div>
<h1>Baked GPS</h1>
<div class="sub">Delivery Management · Lohegaon</div>

<div class="lang-row">
  <button class="lang-btn on" id="btn-en" onclick="setLang('en')">English</button>
  <button class="lang-btn" id="btn-mr" onclick="setLang('mr')">मराठी</button>
</div>

<div class="card">
  <div class="lbl" id="lbl-driver">Driver Login</div>
  <select id="driverName">
    <option value="">Loading drivers…</option>
  </select>
  <input type="password" id="driverPass" placeholder="Password">
  <button class="btn btn-driver" id="btn-dlogin" onclick="driverLogin()">🚗 Driver Login</button>
  <div class="err" id="d-err">Wrong password.</div>
</div>

<div class="divider">or</div>

<div class="card">
  <div class="lbl">Staff Login</div>
  <select id="staffName">
    <option value="">Loading…</option>
  </select>
  <input type="password" id="staffPass" placeholder="Password">
  <button class="btn btn-admin" onclick="staffLogin()">📊 Staff Login</button>
  <div class="err" id="a-err">Wrong name or password.</div>
</div>

<script>
// Register Service Worker for PWA
if('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js', {scope: '/'})
      .then(function(){ console.log('SW registered'); })
      .catch(function(e){ console.log('SW error', e); });
  });
}

var driverPassMap = {};  // name → password (loaded from DB)
var staffPassMap = {};   // name → {password, role, tabs}
var lang = localStorage.getItem('lang') || 'en';

function loadDriversForLogin(){
  var sel = document.getElementById('driverName');
  api({action:'getDrivers'}).then(function(data){
    var list = Array.isArray(data) ? data.filter(function(d){return d.active;}) : [];
    driverPassMap = {};
    list.forEach(function(d){ driverPassMap[d.name] = d.password; });
    sel.innerHTML = '<option value="">Select your name…</option>' +
      list.map(function(d){ return '<option value="'+d.name+'">'+d.name+'</option>'; }).join('');
  }).catch(function(){
    sel.innerHTML = '<option value="">Select your name…</option>';
  });
}

function setLang(l) {
  lang = l;
  localStorage.setItem('lang', l);
  document.getElementById('btn-en').className = 'lang-btn' + (l==='en'?' on':'');
  document.getElementById('btn-mr').className = 'lang-btn' + (l==='mr'?' on':'');
  if (l==='mr') {
    document.getElementById('lbl-driver').textContent    = 'ड्रायव्हर लॉगिन';
    document.getElementById('btn-dlogin').textContent    = '🚗 लॉगिन करा';
    document.getElementById('driverPass').placeholder    = 'पासवर्ड';
  } else {
    document.getElementById('lbl-driver').textContent    = 'Driver Login';
    document.getElementById('btn-dlogin').textContent    = '🚗 Driver Login';
    document.getElementById('driverPass').placeholder    = 'Password';
  }
}

function loadStaffForLogin(){
  var sel = document.getElementById('staffName');
  api({action:'getStaff'}).then(function(data){
    var list = Array.isArray(data) ? data.filter(function(s){return s.active && s.role !== 'super_admin';}) : [];
    staffPassMap = {};
    list.forEach(function(s){ staffPassMap[s.name] = s; });
    sel.innerHTML = '<option value="">Select name…</option>' +
      list.map(function(s){
        var icon = s.role==='super_admin'?'👑':s.role==='chef'?'👨‍🍳':s.role==='packer'?'📦':'👤';
        return '<option value="'+s.name+'">'+icon+' '+s.name+'</option>';
      }).join('');
  }).catch(function(){
    sel.innerHTML = '<option value="">Select name…</option>';
  });
}

function staffLogin(){
  var name = document.getElementById('staffName').value;
  var pass = document.getElementById('staffPass').value;
  var err  = document.getElementById('a-err');
  err.style.display = 'none';
  if(!name){ alert('Select your name'); return; }
  var s = staffPassMap[name];
  if(!s || pass !== s.password){ err.style.display='block'; return; }
  sessionStorage.setItem('role', s.role);
  sessionStorage.setItem('tabs', s.tabs || '[]');
  sessionStorage.setItem('staffName', s.name);
  window.location.href = '/admin';
}

// apply saved lang on load
setLang(lang);
loadDriversForLogin();
loadStaffForLogin();

function driverLogin(){
  var name = document.getElementById('driverName').value;
  var pass = document.getElementById('driverPass').value;
  if (!name) { alert(lang==='mr' ? 'नाव निवडा' : 'Select your name'); return; }
  if (!driverPassMap[name] || pass !== driverPassMap[name]) {
    document.getElementById('d-err').style.display = 'block'; return;
  }
  sessionStorage.setItem('role', 'driver');
  sessionStorage.setItem('driver', name);
  sessionStorage.setItem('lang', lang);
  window.location.href = '/driver';
}

document.getElementById('driverPass').addEventListener('keydown', function(e){ if(e.key==='Enter') driverLogin(); });
document.getElementById('staffPass').addEventListener('keydown', function(e){ if(e.key==='Enter') staffLogin(); });

// redirect if already logged in
var _r = sessionStorage.getItem('role');
if(_r==='driver') window.location.href='/driver';
if(_r==='super_admin'||_r==='admin'||_r==='assistant'||_r==='chef'||_r==='packer') window.location.href='/admin';
</script>
</body>
</html>
