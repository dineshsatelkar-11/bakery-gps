<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Baked — Shops</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5ede0;color:#1e1611;max-width:520px;margin:0 auto;min-height:100vh}
.topbar{background:#4a2f14;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99}
.topbar-title{color:#fff;font-size:15px;font-weight:800}
.back{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:-apple-system,sans-serif;text-decoration:none;display:inline-block}
.page{padding:14px 14px 80px}
.card{background:#fff;border:1.5px solid #e8dfd2;border-radius:16px;padding:14px;margin-bottom:10px}
.lbl{font-size:10px;letter-spacing:2px;color:#8a7a6a;font-family:monospace;font-weight:700;margin-bottom:8px;text-transform:uppercase}
select,input[type=text],input[type=tel]{width:100%;padding:11px 14px;border:1.5px solid #e8dfd2;border-radius:10px;font-size:14px;color:#1e1611;background:#f5ede0;outline:none;-webkit-appearance:none;font-family:-apple-system,sans-serif;margin-bottom:8px}
.btn{width:100%;padding:13px;border:none;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;font-family:-apple-system,sans-serif;margin-bottom:8px}
.btn-add{background:#2d7a4f;color:#fff}
.btn-save{background:#4a2f14;color:#fff}
.btn-gps{background:#1a5fa8;color:#fff}
.btn-sm{padding:7px 12px;border-radius:10px;font-size:11px;font-weight:700;border:none;cursor:pointer;font-family:-apple-system,sans-serif}
.btn-edit{background:#e3f2fd;color:#1565c0}
.btn-del{background:#fde8e8;color:#c8382a}
.btn-cancel{background:#f5ede0;color:#4a2f14;border:1.5px solid #e8dfd2;width:100%}
.msg{padding:11px 14px;border-radius:12px;font-size:12px;font-weight:600;font-family:monospace;margin-bottom:10px;line-height:1.8}
.ok{background:#e8f5e9;color:#2d7a4f;border:1px solid #a5d6a7}
.er{background:#fde8e8;color:#c8382a;border:1px solid #f0b0b0}
.in{background:#e3f2fd;color:#1565c0;border:1px solid #90caf9}
.shop-row{background:#fff;border:1.5px solid #e8dfd2;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.shop-name{font-size:14px;font-weight:800;color:#1e1611}
.shop-meta{font-size:10px;color:#8a7a6a;font-family:monospace;margin:3px 0 6px}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;font-family:monospace}
.b-ok{background:#e8f5e9;color:#2d7a4f}
.b-miss{background:#fde8e8;color:#c8382a}
.filter-row{display:flex;gap:8px;margin-bottom:10px}
.filter-row select,.filter-row input{margin-bottom:0}
.stat-row{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:#fff;border:1.5px solid #e8dfd2;border-radius:12px;padding:10px;text-align:center}
.stat-n{font-size:20px;font-weight:900;color:#4a2f14}
.stat-l{font-size:9px;color:#8a7a6a;font-family:monospace}
.DC-Bharat{background:#fff3e0;color:#c8864a}
.DC-Anand{background:#e3f2fd;color:#1a5fa8}
.DC-Vikas{background:#e8f5e9;color:#2d7a4f}
.DC-Yuvraj{background:#f3e8ff;color:#6e3da8}
.DC-Rama{background:#fde8e8;color:#c8382a}
.DC-Dinesh{background:#fce4ec;color:#880e4f}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#f5ede0;border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:900;color:#4a2f14;margin-bottom:16px}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-title">🏪 Shop Management</div>
  <a href="admin.html" class="back">← Admin</a>
</div>

<div class="page">
  <div class="stat-row" id="stats"></div>

  <button class="btn btn-add" onclick="openAdd()">➕ Add New Shop</button>

  <div class="filter-row">
    <input type="text" id="srch" placeholder="Search…" oninput="renderList()" style="margin-bottom:0">
    <select id="fDrv" onchange="renderList()" style="margin-bottom:0">
      <option value="">All Drivers</option>
      <option>Bharat</option><option>Anand</option><option>Vikas</option>
      <option>Yuvraj</option><option>Rama</option><option>Dinesh</option>
    </select>
  </div>
  <div class="filter-row">
    <select id="fGps" onchange="renderList()" style="margin-bottom:0">
      <option value="">All GPS Status</option>
      <option value="saved">GPS Saved ✅</option>
      <option value="missing">GPS Missing ⚠</option>
    </select>
  </div>

  <div id="msg" style="display:none" class="msg ok"></div>
  <div id="shopList"></div>
</div>

<!-- ADD / EDIT MODAL -->
<div class="modal-bg" id="modal" style="display:none" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Add New Shop</div>
    <input type="hidden" id="edit-id">

    <div class="lbl">Shop Name *</div>
    <input type="text" id="f-name" placeholder="e.g. C Tea Post - Baner">

    <div class="lbl">Address</div>
    <input type="text" id="f-address" placeholder="Full address">

    <div class="lbl">Area</div>
    <input type="text" id="f-area" placeholder="e.g. Baner, Kharadi">

    <div class="lbl">Assigned Driver</div>
    <select id="f-driver">
      <option value="">Unassigned (Dinesh)</option>
      <option>Bharat</option><option>Anand</option><option>Vikas</option>
      <option>Yuvraj</option><option>Rama</option>
    </select>

    <div class="lbl">Mobile No</div>
    <input type="tel" id="f-mobile" placeholder="Shop contact number">

    <div class="lbl">Flag / Note</div>
    <input type="text" id="f-flag" placeholder="e.g. New shop, Weekend only">

    <div class="lbl">GPS Location</div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input type="text" id="f-lat" placeholder="Latitude" style="margin-bottom:0;flex:1">
      <input type="text" id="f-lng" placeholder="Longitude" style="margin-bottom:0;flex:1">
    </div>
    <button class="btn btn-gps" id="gpsPickBtn" onclick="pickGPS()">📍 Use Current Location</button>
    <div id="gps-msg" style="display:none" class="msg in"></div>

    <div id="form-msg" style="display:none" class="msg ok"></div>
    <button class="btn btn-save" onclick="saveShop()">💾 Save Shop</button>
    <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbyi-IJ6NLR28hRTeesy52THTbdcYCSnz3lp7NtEaJsxBOiNOm-9emMu0xOHT6hvWSE-/exec',
  UNASSIGNED_OWNER: 'Dinesh'
};
</script>
<script>
if(sessionStorage.getItem('role')!=='admin') window.location.href='index.html';

const API = CONFIG.API_URL;
function api(p){ return fetch(API+'?'+new URLSearchParams(p)).then(r=>r.json()).catch(()=>[]); }
function apiPost(b){ return fetch(API,{method:'POST',body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>({})); }

let shops=[];

async function load(){
  shops=await api({action:'getShops'});
  if(!Array.isArray(shops)) shops=[];
  renderStats(); renderList();
}

function renderStats(){
  const saved=shops.filter(s=>s.lat).length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-n">${shops.length}</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-n" style="color:#2d7a4f">${saved}</div><div class="stat-l">GPS Saved</div></div>
    <div class="stat"><div class="stat-n" style="color:#c8382a">${shops.length-saved}</div><div class="stat-l">GPS Missing</div></div>`;
}

function renderList(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const fd=document.getElementById('fDrv').value;
  const fg=document.getElementById('fGps').value;
  let list=shops;
  if(q) list=list.filter(s=>(s.name+' '+(s.area||'')).toLowerCase().includes(q));
  if(fd) list=list.filter(s=>s.assigned_driver===fd);
  if(fg==='saved') list=list.filter(s=>s.lat);
  if(fg==='missing') list=list.filter(s=>!s.lat);
  document.getElementById('shopList').innerHTML=list.map(s=>`
    <div class="shop-row">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="shop-name">${s.name}</div>
        <span class="badge ${s.lat?'b-ok':'b-miss'}">${s.lat?'✅ GPS':'⚠ No GPS'}</span>
      </div>
      <div class="shop-meta">
        ${s.area||'—'} · <span class="badge DC-${s.assigned_driver||'Dinesh'}">${s.assigned_driver||'Dinesh'}</span>
        ${s.mobile?'· 📞 '+s.mobile:''}
      </div>
      ${s.lat?`<div style="font-size:11px;font-family:monospace;color:#2d7a4f;margin-bottom:6px">${s.lat}, ${s.lng}
        <a href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank" style="color:#1565c0;margin-left:6px">map</a>
      </div>`:''}
      ${s.address?`<div style="font-size:11px;color:#8a7a6a;font-family:monospace;margin-bottom:6px">${s.address}</div>`:''}
      ${s.flag?`<div style="font-size:11px;color:#7a4800;font-family:monospace;margin-bottom:6px">🏷 ${s.flag}</div>`:''}
      <div style="display:flex;gap:8px">
        <button class="btn-sm btn-edit" onclick='openEdit(${JSON.stringify(s)})'>✏️ Edit</button>
        <button class="btn-sm btn-del" onclick="deleteShop('${s.shop_id}','${s.name}')">🗑 Delete</button>
        ${s.lat?`<a href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank" class="btn-sm" style="background:#e3f2fd;color:#1565c0;text-decoration:none;padding:7px 12px;border-radius:10px;font-size:11px;font-weight:700">🗺</a>`:''}
      </div>
    </div>`).join('');
}

function openAdd(){
  document.getElementById('modalTitle').textContent='Add New Shop';
  ['f-name','f-address','f-area','f-mobile','f-flag','f-lat','f-lng','edit-id'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-driver').value='';
  document.getElementById('form-msg').style.display='none';
  document.getElementById('gps-msg').style.display='none';
  document.getElementById('modal').style.display='flex';
}

function openEdit(s){
  document.getElementById('modalTitle').textContent='Edit Shop';
  document.getElementById('edit-id').value=s.shop_id;
  document.getElementById('f-name').value=s.name||'';
  document.getElementById('f-address').value=s.address||'';
  document.getElementById('f-area').value=s.area||'';
  document.getElementById('f-driver').value=s.assigned_driver||'';
  document.getElementById('f-mobile').value=s.mobile||'';
  document.getElementById('f-flag').value=s.flag||'';
  document.getElementById('f-lat').value=s.lat||'';
  document.getElementById('f-lng').value=s.lng||'';
  document.getElementById('form-msg').style.display='none';
  document.getElementById('gps-msg').style.display='none';
  document.getElementById('modal').style.display='flex';
}

function closeModal(){ document.getElementById('modal').style.display='none'; }
function closeModalOutside(e){ if(e.target===document.getElementById('modal')) closeModal(); }

function pickGPS(){
  if(!navigator.geolocation){ alert('GPS not available'); return; }
  const btn=document.getElementById('gpsPickBtn');
  btn.textContent='⏳ Getting…'; btn.disabled=true;
  const gmsg=document.getElementById('gps-msg');
  gmsg.textContent='📡 Getting location…'; gmsg.className='msg in'; gmsg.style.display='block';
  navigator.geolocation.getCurrentPosition(pos=>{
    document.getElementById('f-lat').value=parseFloat(pos.coords.latitude.toFixed(6));
    document.getElementById('f-lng').value=parseFloat(pos.coords.longitude.toFixed(6));
    gmsg.textContent='📍 Location captured: '+document.getElementById('f-lat').value+', '+document.getElementById('f-lng').value;
    gmsg.className='msg ok';
    btn.textContent='📍 Use Current Location'; btn.disabled=false;
  },()=>{ btn.textContent='📍 Use Current Location'; btn.disabled=false; gmsg.textContent='❌ GPS failed.'; gmsg.className='msg er'; },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

async function saveShop(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){ alert('Shop name is required'); return; }
  const id=document.getElementById('edit-id').value;
  const body={
    action: id?'updateShop':'addShop',
    shop_id:id,
    name, address:document.getElementById('f-address').value.trim(),
    area:document.getElementById('f-area').value.trim(),
    assigned_driver:document.getElementById('f-driver').value||CONFIG.UNASSIGNED_OWNER,
    mobile:document.getElementById('f-mobile').value.trim(),
    flag:document.getElementById('f-flag').value.trim(),
    lat:document.getElementById('f-lat').value,
    lng:document.getElementById('f-lng').value,
    updated_by:'Admin', updated_at:new Date().toLocaleString('en-IN')
  };
  const fmsg=document.getElementById('form-msg');
  fmsg.textContent='Saving…'; fmsg.className='msg in'; fmsg.style.display='block';
  const res=await apiPost(body);
  if(res.ok){
    fmsg.textContent='✅ Saved!'; fmsg.className='msg ok';
    setTimeout(()=>{ closeModal(); load(); },800);
  } else {
    fmsg.textContent='❌ Failed: '+(res.error||'unknown'); fmsg.className='msg er';
  }
}

async function deleteShop(id, name){
  if(!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  const res=await apiPost({action:'deleteShop',shop_id:id});
  if(res.ok){ showMsg('✅ Deleted: '+name,'ok'); load(); }
  else showMsg('❌ Delete failed','er');
}

function showMsg(txt,type){ const el=document.getElementById('msg'); el.textContent=txt; el.className='msg '+type; el.style.display='block'; setTimeout(()=>el.style.display='none',3000); }

load();
</script>
</body>
</html>
