<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tea Post Head — IBCAB</title>
<script src="config.js"></script>
<script src="api.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f4ff;color:#1e1611;max-width:520px;margin:0 auto;min-height:100vh}
/* ── Top bar ── */
.topbar{background:linear-gradient(135deg,#1b5e20,#2e7d32);padding:13px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99}
.topbar-title{color:#fff;font-size:15px;font-weight:800;line-height:1.2}
.topbar-sub{color:#a5d6a7;font-size:11px;font-family:monospace;margin-top:1px}
.logout-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 11px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:-apple-system,sans-serif;flex-shrink:0}
/* ── Tabs ── */
.tabs{display:flex;background:#fff;border-bottom:2px solid #e8f5e9;position:sticky;top:53px;z-index:98}
.tab{flex:1;padding:12px 4px;border:none;background:none;font-size:11px;font-weight:700;cursor:pointer;color:#9fa8da;font-family:-apple-system,sans-serif;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:#2e7d32;border-bottom-color:#2e7d32}
/* ── Pages ── */
.page{display:none;padding:14px 14px 100px}.page.on{display:block}
/* ── Cards ── */
.card{background:#fff;border:1.5px solid #e8eaf6;border-radius:16px;padding:14px;margin-bottom:10px}
.card-title{font-size:11px;letter-spacing:2px;color:#9fa8da;font-family:monospace;font-weight:700;text-transform:uppercase;margin-bottom:10px}
/* ── Status badge ── */
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:800;font-family:monospace}
.s-delivered{background:#e8f5e9;color:#2d7a4f;border:1px solid #a5d6a7}
.s-pending{background:#fff8e1;color:#7a4800;border:1px solid #ffe082}
.s-approved{background:#e8eaf6;color:#1a237e;border:1px solid #9fa8da}
.s-dispatched{background:#e0f7fa;color:#006064;border:1px solid #80deea}
.s-rejected{background:#fde8e8;color:#c8382a;border:1px solid #f0b0b0}
.s-kitchen{background:#fff3e0;color:#c8864a;border:1px solid #ffe0b2}
.s-notyet{background:#f5f5f5;color:#9e9e9e;border:1px solid #e0e0e0}
.s-noorder{background:#f5f5f5;color:#9e9e9e;border:1px solid #e0e0e0}
/* ── Stat row ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat-box{background:#fff;border:1.5px solid #e8eaf6;border-radius:12px;padding:10px 6px;text-align:center}
.stat-num{font-size:20px;font-weight:900;color:#2e7d32}
.stat-lbl{font-size:9px;color:#9fa8da;font-family:monospace;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
/* ── Shop row ── */
.shop-row{border-bottom:1px solid #f0f4ff;padding:10px 0}
.shop-row:last-child{border-bottom:none}
.shop-name{font-size:13px;font-weight:800;color:#1e1611}
.shop-meta{font-size:11px;color:#546e7a;font-family:monospace;margin-top:2px}
.shop-row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.items-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.item-chip{background:#e8f5e9;color:#2d7a4f;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;font-family:monospace}
/* ── Call btn ── */
.call-btn{background:#e8f5e9;color:#2d7a4f;border:1.5px solid #a5d6a7;border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;text-decoration:none;display:inline-block;font-family:-apple-system,sans-serif;flex-shrink:0}
/* ── Track btn ── */
.track-btn{display:block;width:100%;padding:12px;border:none;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:-apple-system,sans-serif;background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#fff;text-align:center;text-decoration:none;margin-top:10px}
/* ── Driver section ── */
.driver-block{border:1.5px solid #e8f5e9;border-radius:12px;padding:12px;margin-bottom:10px;background:#f9fff9}
.driver-name{font-size:15px;font-weight:900;color:#1b5e20}
/* ── Date bar ── */
.date-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.date-bar input{flex:1;padding:8px 10px;border:1.5px solid #c8e6c9;border-radius:10px;font-size:13px;font-family:monospace;color:#1e1611;background:#fff;outline:none}
/* ── Item row ── */
.item-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0f4ff;font-size:12px}
.item-row:last-child{border-bottom:none}
/* ── Refresh btn ── */
.refresh-btn{background:#e8f5e9;border:1.5px solid #a5d6a7;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#2e7d32;font-family:-apple-system,sans-serif;flex-shrink:0}
/* ── Empty ── */
.empty-msg{text-align:center;padding:24px;font-size:12px;color:#9fa8da;font-family:monospace}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">☕ Tea Post Head Dashboard</div>
    <div class="topbar-sub" id="topName">Loading…</div>
  </div>
  <button class="logout-btn" onclick="doLogout()">Logout</button>
</div>

<div class="tabs">
  <button class="tab on" id="tb-today"  onclick="showTab('today')">📊 Today</button>
  <button class="tab"    id="tb-orders" onclick="showTab('orders')">📋 Orders</button>
  <button class="tab"    id="tb-track"  onclick="showTab('track')">📍 Track</button>
</div>

<!-- ══════════════════ TODAY TAB ══════════════════ -->
<div class="page on" id="pg-today">
  <div class="date-bar">
    <input type="date" id="today-date" onchange="loadToday()">
    <button class="refresh-btn" onclick="loadToday()">🔄</button>
  </div>
  <div id="today-content">
    <div class="card"><div class="empty-msg">Loading…</div></div>
  </div>
</div>

<!-- ══════════════════ ORDERS TAB ══════════════════ -->
<div class="page" id="pg-orders">
  <div class="date-bar">
    <input type="date" id="orders-date" onchange="loadOrders()">
    <button class="refresh-btn" onclick="loadOrders()">🔄</button>
  </div>
  <div id="orders-content">
    <div class="card"><div class="empty-msg">Loading…</div></div>
  </div>
</div>

<!-- ══════════════════ TRACK TAB ══════════════════ -->
<div class="page" id="pg-track">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-size:13px;font-weight:800;color:#2e7d32">Driver Tracking</div>
    <button class="refresh-btn" onclick="loadTrack()">🔄 Refresh</button>
  </div>
  <div id="track-content">
    <div class="card"><div class="empty-msg">Loading…</div></div>
  </div>
</div>

<script>
var staffName = '';

// ── Session guard ──
(function(){
  var role = sessionStorage.getItem('role');
  if(!role && localStorage.getItem('staffRole')){
    role = localStorage.getItem('staffRole');
    sessionStorage.setItem('role', role);
    sessionStorage.setItem('staffName', localStorage.getItem('staffNamePersist')||'');
  }
  if(role !== 'teapost_head'){ goto(''); return; }
  staffName = sessionStorage.getItem('staffName') || localStorage.getItem('staffNamePersist') || 'Tea Post Head';
  document.getElementById('topName').textContent = staffName;
  init();
})();

function doLogout(){
  sessionStorage.clear();
  localStorage.removeItem('staffRole');
  localStorage.removeItem('staffTabs');
  localStorage.removeItem('staffNamePersist');
  goto('');
}

// ── Helpers ──
function esc(s){ var d=document.createElement('div');d.textContent=s||'';return d.innerHTML; }
function isTeaPost(name){ return (name||'').toLowerCase().indexOf('tea post') >= 0; }
function todayStr(){ var d=new Date();return d.getFullYear()+'-'+zp(d.getMonth()+1)+'-'+zp(d.getDate()); }
function tomorrowStr(){ var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+'-'+zp(d.getMonth()+1)+'-'+zp(d.getDate()); }
function zp(n){ return String(n).padStart(2,'0'); }
function fmtDate(s){
  var d=new Date(s+'T00:00:00');
  return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
}
function fmtTime(t){ if(!t) return '—'; return t; }

var statusLabel = {pending:'⏳ Pending',approved:'✅ Approved',rejected:'❌ Rejected',kitchen:'👨‍🍳 Kitchen',packaging:'📦 Packaging',dispatched:'🚚 Dispatched'};
var statusClass = {pending:'s-pending',approved:'s-approved',rejected:'s-rejected',kitchen:'s-kitchen',packaging:'s-dispatched',dispatched:'s-dispatched'};

function showTab(t){
  ['today','orders','track'].forEach(function(x){
    var pg=document.getElementById('pg-'+x); if(pg) pg.classList.toggle('on',x===t);
    var tb=document.getElementById('tb-'+x); if(tb) tb.classList.toggle('on',x===t);
  });
  if(t==='today')  loadToday();
  if(t==='orders') loadOrders();
  if(t==='track')  loadTrack();
}

function init(){
  var td = document.getElementById('today-date');
  var od = document.getElementById('orders-date');
  if(td) td.value = todayStr();
  if(od) od.value = tomorrowStr();
  loadToday();
}

// ══════════════════════════════════════════════
// TODAY TAB — all tea post delivery status
// ══════════════════════════════════════════════
function loadToday(){
  var el = document.getElementById('today-content');
  el.innerHTML = '<div class="card"><div class="empty-msg">Loading…</div></div>';
  var dateEl = document.getElementById('today-date');
  var date = dateEl ? dateEl.value : todayStr();

  Promise.all([
    api({action:'getOrders', date:date}),
    api({action:'getDeliveries', date:date}),
    api({action:'getDrivers'})
  ]).then(function(res){
    var orders     = (Array.isArray(res[0]) ? res[0] : []).filter(function(o){ return isTeaPost(o.shop_name); });
    var allDel     = Array.isArray(res[1]) ? res[1] : [];
    var drivers    = Array.isArray(res[2]) ? res[2] : [];

    // Build delivery map by shop_id
    var delMap = {};
    allDel.forEach(function(d){ delMap[d.shop_id] = d; });

    // Build driver info map
    var driverMap = {};
    drivers.forEach(function(d){ driverMap[d.name] = d; });

    if(!orders.length){
      el.innerHTML = '<div class="card"><div class="empty-msg">No tea post orders found for '+esc(fmtDate(date))+'</div></div>';
      return;
    }

    var delivered = orders.filter(function(o){ return !!delMap[o.shop_id]; }).length;
    var pending   = orders.length - delivered;

    var html = '';

    // ── Summary stats ──
    html += '<div class="stat-grid">';
    html += '<div class="stat-box"><div class="stat-num" style="color:#2e7d32">'+orders.length+'</div><div class="stat-lbl">Total</div></div>';
    html += '<div class="stat-box"><div class="stat-num" style="color:#2d7a4f">'+delivered+'</div><div class="stat-lbl">Delivered</div></div>';
    html += '<div class="stat-box"><div class="stat-num" style="color:#7a4800">'+pending+'</div><div class="stat-lbl">Pending</div></div>';
    html += '<div class="stat-box"><div class="stat-num" style="color:#1a237e">'+Math.round(delivered/orders.length*100)+'%</div><div class="stat-lbl">Done</div></div>';
    html += '</div>';

    // ── Per shop list ──
    html += '<div class="card"><div class="card-title">Tea Posts — '+esc(fmtDate(date))+'</div>';
    orders.forEach(function(o){
      var del = delMap[o.shop_id] || null;
      var dInfo = driverMap[o.driver] || null;
      var dMobile = dInfo ? (dInfo.mobile||'') : '';

      // Parse items
      var iArr=(o.items||'').split(','), qArr=(o.qty||'').split(',');
      var itemsSummary=iArr.map(function(it,i){
        var q=parseInt(qArr[i])||0; if(!it.trim()||!q) return '';
        return '<span class="item-chip">'+esc(it.trim())+' ×'+q+'</span>';
      }).filter(Boolean).join('');

      html += '<div class="shop-row">';
      html += '<div class="shop-row-top">';
      html += '<div><div class="shop-name">'+esc(o.shop_name)+'</div>';
      if(o.driver) html += '<div class="shop-meta">🚚 '+esc(o.driver)+(dMobile?' · <a href="tel:'+esc(dMobile)+'" style="color:#2d7a4f;text-decoration:none">'+esc(dMobile)+'</a>':'')+'</div>';
      html += '</div>';
      if(del){
        html += '<span class="status-badge s-delivered">✅ '+esc(fmtTime(del.time))+'</span>';
      } else {
        html += '<span class="status-badge s-dispatched">🚚 Pending</span>';
      }
      html += '</div>';
      if(del && del.lat && del.lng){
        html += '<div style="margin-top:4px"><a href="https://www.google.com/maps?q='+del.lat+','+del.lng+'" target="_blank" style="font-size:10px;color:#1565c0;font-family:monospace">📍 View delivery location</a></div>';
      }
      if(itemsSummary){
        html += '<div class="items-chips">'+itemsSummary+'</div>';
      }
      html += '</div>';
    });
    html += '</div>';

    el.innerHTML = html;
  }).catch(function(){
    el.innerHTML = '<div class="card msg er">Failed to load. Check your connection.</div>';
  });
}

// ══════════════════════════════════════════════
// ORDERS TAB — tea post customer pre-orders
// ══════════════════════════════════════════════
function loadOrders(){
  var el = document.getElementById('orders-content');
  el.innerHTML = '<div class="card"><div class="empty-msg">Loading…</div></div>';
  var dateEl = document.getElementById('orders-date');
  var date = dateEl ? dateEl.value : tomorrowStr();

  api({action:'getCustomerOrders', delivery_date:date, limit:200}).then(function(data){
    var list = (Array.isArray(data) ? data : []).filter(function(o){ return isTeaPost(o.shop_name); });

    if(!list.length){
      el.innerHTML = '<div class="card"><div class="empty-msg">No tea post orders for '+esc(fmtDate(date))+'</div></div>';
      return;
    }

    var approved  = list.filter(function(o){ return o.status==='approved'||o.status==='kitchen'||o.status==='packaging'||o.status==='dispatched'; }).length;
    var pendingC  = list.filter(function(o){ return o.status==='pending'; }).length;
    var rejected  = list.filter(function(o){ return o.status==='rejected'; }).length;

    var html = '';

    // ── Stats ──
    html += '<div class="stat-grid">';
    html += '<div class="stat-box"><div class="stat-num" style="color:#2e7d32">'+list.length+'</div><div class="stat-lbl">Total</div></div>';
    html += '<div class="stat-box"><div class="stat-num" style="color:#2d7a4f">'+approved+'</div><div class="stat-lbl">Approved</div></div>';
    html += '<div class="stat-box"><div class="stat-num" style="color:#7a4800">'+pendingC+'</div><div class="stat-lbl">Pending</div></div>';
    html += '<div class="stat-box"><div class="stat-num" style="color:#c8382a">'+rejected+'</div><div class="stat-lbl">Rejected</div></div>';
    html += '</div>';

    // ── Per shop order ──
    html += '<div class="card"><div class="card-title">Tea Post Orders — '+esc(fmtDate(date))+'</div>';
    list.forEach(function(o){
      var iArr=(o.items||'').split(','), qArr=(o.qty||'').split(','), tot=0;
      var rows=iArr.map(function(item,i){
        var q=parseInt(qArr[i])||0; if(!item.trim()||!q) return '';
        tot+=q;
        return '<div class="item-row"><span style="font-weight:600;color:#1e1611;flex:1">'+esc(item.trim())+'</span><span style="font-weight:800;color:#2e7d32;font-family:monospace">× '+q+'</span></div>';
      }).filter(Boolean).join('');

      var s = o.status||'pending';
      html += '<div class="shop-row">';
      html += '<div class="shop-row-top">';
      html += '<div class="shop-name">'+esc(o.shop_name)+'</div>';
      html += '<span class="status-badge '+esc(statusClass[s]||'s-pending')+'">'+esc(statusLabel[s]||s)+'</span>';
      html += '</div>';
      if(rows){
        html += '<div style="margin-top:8px">'+rows+'</div>';
        html += '<div style="font-size:10px;color:#9fa8da;font-family:monospace;text-align:right;margin-top:4px">Total: '+tot+' items</div>';
      }
      if(o.note)       html += '<div style="font-size:11px;color:#546e7a;font-family:monospace;margin-top:4px">📝 '+esc(o.note)+'</div>';
      if(o.admin_note) html += '<div style="font-size:11px;color:#1565c0;font-family:monospace;margin-top:3px">💬 '+esc(o.admin_note)+'</div>';
      html += '</div>';
    });
    html += '</div>';

    el.innerHTML = html;
  }).catch(function(){
    el.innerHTML = '<div class="card msg er">Failed to load orders.</div>';
  });
}

// ══════════════════════════════════════════════
// TRACK TAB — all drivers with tea post shops
// ══════════════════════════════════════════════
function loadTrack(){
  var el = document.getElementById('track-content');
  el.innerHTML = '<div class="card"><div class="empty-msg">Loading…</div></div>';
  var today = todayStr();

  Promise.all([
    api({action:'getOrders', date:today}),
    api({action:'getDeliveries', date:today}),
    api({action:'getDrivers'})
  ]).then(function(res){
    var allOrders  = Array.isArray(res[0]) ? res[0] : [];
    var allDel     = Array.isArray(res[1]) ? res[1] : [];
    var drivers    = Array.isArray(res[2]) ? res[2] : [];

    var tpOrders = allOrders.filter(function(o){ return isTeaPost(o.shop_name); });

    // Build delivery map
    var delMap = {};
    allDel.forEach(function(d){ delMap[d.shop_id] = d; });

    // Group tea post orders by driver
    var byDriver = {};
    tpOrders.forEach(function(o){
      var d = o.driver||'(no driver)';
      if(!byDriver[d]) byDriver[d] = [];
      byDriver[d].push(o);
    });

    var driverNames = Object.keys(byDriver);

    var html = '';

    if(!driverNames.length){
      html = '<div class="card"><div class="empty-msg">No tea post deliveries scheduled today.</div></div>';
      el.innerHTML = html;
      return;
    }

    // ── Per driver block ──
    driverNames.forEach(function(dName){
      var shops = byDriver[dName];
      var dInfo = drivers.find(function(d){ return d.name === dName; }) || null;
      var dMobile = dInfo ? (dInfo.mobile||'') : '';
      var trackRaw = dInfo ? (dInfo.tracking_url||'') : '';
      var trackOn  = dInfo ? !!dInfo.tracking_enabled : false;
      var urlMatch = trackRaw.match(/https?:\/\/\S+/);
      var trackUrl = urlMatch ? urlMatch[0] : trackRaw;

      var done   = shops.filter(function(o){ return !!delMap[o.shop_id]; }).length;
      var total  = shops.length;

      html += '<div class="driver-block">';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">';
      html += '<div>';
      html += '<div class="driver-name">🚗 '+esc(dName)+'</div>';
      html += '<div style="font-size:11px;color:#546e7a;font-family:monospace;margin-top:2px">☕ '+done+' / '+total+' tea posts delivered</div>';
      if(dMobile) html += '<div style="font-size:11px;color:#546e7a;font-family:monospace;margin-top:1px">📞 '+esc(dMobile)+'</div>';
      html += '</div>';
      if(dMobile) html += '<a href="tel:'+esc(dMobile)+'" class="call-btn">📞 Call</a>';
      html += '</div>';

      // Shops list
      shops.forEach(function(o){
        var del = delMap[o.shop_id] || null;
        html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #e8f5e9">';
        html += '<div style="font-size:12px;font-weight:700;color:#1e1611">'+esc(o.shop_name)+'</div>';
        if(del){
          html += '<span class="status-badge s-delivered" style="font-size:10px;padding:2px 8px">✅ '+esc(fmtTime(del.time))+'</span>';
        } else {
          html += '<span class="status-badge s-dispatched" style="font-size:10px;padding:2px 8px">🚚 Pending</span>';
        }
        html += '</div>';
      });

      // Tracking link
      if(trackUrl && trackOn){
        html += '<a href="'+esc(trackUrl)+'" target="_blank" class="track-btn">📍 Track '+esc(dName)+' Live</a>';
      } else {
        html += '<div style="margin-top:8px;text-align:center;font-size:11px;color:#9fa8da;font-family:monospace">Live tracking not enabled for this driver</div>';
      }

      html += '</div>';
    });

    el.innerHTML = html;
  }).catch(function(){
    el.innerHTML = '<div class="card msg er">Failed to load tracking data.</div>';
  });
}
</script>
</body>
</html>
