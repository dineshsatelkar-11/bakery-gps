<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Its Baked Driver</title>
<script src="config.js"></script>
<script src="api.js"></script>
<link rel="manifest" href="manifest-driver.json">
<meta name="theme-color" content="#2d7a4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Its Baked Driver">
<link rel="apple-touch-icon" href="icon-driver-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5ede0;color:#1e1611;max-width:440px;margin:0 auto;min-height:100vh}
.topbar{background:#2d7a4f;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99}
.topbar-title{color:#fff;font-size:15px;font-weight:800}
.topbar-sub{color:#a8d5b8;font-size:11px;font-family:monospace}
.topbar-right{display:flex;gap:8px;align-items:center}
.lang-tog{background:rgba(255,255,255,.2);border:none;color:#fff;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:-apple-system,sans-serif}
.logout{background:rgba(255,255,255,.15);border:none;color:#fff;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:-apple-system,sans-serif}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e8dfd2;position:sticky;top:53px;z-index:98}
.tab{flex:1;padding:12px 4px;border:none;background:none;font-size:11px;font-weight:700;cursor:pointer;color:#8a7a6a;font-family:-apple-system,sans-serif;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:#2d7a4f;border-bottom-color:#2d7a4f}
.page{display:none;padding:12px 14px 80px}
.page.on{display:block}
.card{background:#fff;border:1.5px solid #e8dfd2;border-radius:16px;padding:14px;margin-bottom:10px}
.lbl{font-size:10px;letter-spacing:2px;color:#8a7a6a;font-family:monospace;font-weight:700;margin-bottom:8px;text-transform:uppercase}
input[type=text],input[type=date]{width:100%;padding:11px 14px;border:1.5px solid #e8dfd2;border-radius:10px;font-size:14px;color:#1e1611;background:#f5ede0;outline:none;font-family:-apple-system,sans-serif;-webkit-appearance:none}
.summary-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f5ede0}
.summary-item:last-child{border-bottom:none}
.btn{width:100%;padding:13px;border:none;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;font-family:-apple-system,sans-serif;margin-bottom:8px}
.btn-gps{background:#2d7a4f;color:#fff}
.btn-save{background:#4a2f14;color:#fff}
.btn-start{background:#1a5fa8;color:#fff;font-size:16px;padding:16px}
.btn-sm{padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:-apple-system,sans-serif}
.btn-deliver{background:#2d7a4f;color:#fff}
.btn-map{background:#e3f2fd;color:#1565c0}
.msg{padding:11px 14px;border-radius:12px;font-size:12px;font-weight:600;font-family:monospace;margin-bottom:10px;line-height:1.8;white-space:pre-line}
.ok{background:#e8f5e9;color:#2d7a4f;border:1px solid #a5d6a7}
.er{background:#fde8e8;color:#c8382a;border:1px solid #f0b0b0}
.in{background:#e3f2fd;color:#1565c0;border:1px solid #90caf9}
.shop-list{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto}
.si{padding:11px 14px;border:1.5px solid #e8dfd2;border-radius:12px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:10px}
.si.on{border-color:#2d7a4f;background:#f0faf4}
.si.gps-saved{border-color:#a5d6a7}
.si-n{font-size:13px;font-weight:700;flex:1}
.si-a{font-size:10px;color:#8a7a6a;font-family:monospace;margin-top:2px}
/* ROUTE */
.stat-row{display:flex;gap:8px;margin-bottom:0}
.stat{flex:1;background:rgba(255,255,255,.7);border:1.5px solid #e8dfd2;border-radius:12px;padding:10px;text-align:center}
.stat-n{font-size:20px;font-weight:900;color:#4a2f14}
.stat-l{font-size:9px;color:#8a7a6a;font-family:monospace;text-transform:uppercase}
.route-summary-card{background:#fff;border:1.5px solid #e8dfd2;border-radius:16px;padding:14px;margin-bottom:10px}
.progress-wrap{background:#e8dfd2;border-radius:6px;height:8px;margin:8px 0 10px;overflow:hidden}
.progress-fill{height:8px;border-radius:6px;background:linear-gradient(90deg,#2d7a4f,#4caf7d);transition:width .4s ease}
.route-stop{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.rnum{width:30px;height:30px;border-radius:50%;background:#2d7a4f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0}
.rnum.done{background:#8a7a6a}
.rinfo{flex:1;background:#fff;border:1.5px solid #e8dfd2;border-radius:12px;padding:10px 12px}
.rinfo.done{background:#f5f5f5;opacity:.6}
.rname{font-size:13px;font-weight:800}
.rmeta{font-size:10px;color:#8a7a6a;font-family:monospace;margin-top:2px}
.rcoords{font-size:10px;color:#2d7a4f;font-family:monospace;margin-top:3px}
.rline{width:2px;background:#e8dfd2;height:8px;margin-left:14px}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;font-family:monospace}
.b-ok{background:#e8f5e9;color:#2d7a4f}
.b-warn{background:#fff8e1;color:#7a4800}
.b-miss{background:#fde8e8;color:#c8382a}
.b-done{background:#e8f5e9;color:#2d7a4f}
/* ORDERS */
.order-card{background:#fff;border:1.5px solid #e8dfd2;border-radius:14px;padding:12px 14px;margin-bottom:9px}
.order-shop{font-size:14px;font-weight:800;color:#4a2f14}
.order-meta{font-size:10px;color:#8a7a6a;font-family:monospace;margin:3px 0 6px}
.order-items{font-size:12px;font-family:monospace;background:#f5ede0;padding:8px 10px;border-radius:8px}
/* START BANNER */
.start-banner{background:#1a5fa8;color:#fff;border-radius:16px;padding:16px;margin-bottom:14px;text-align:center}
.start-banner-title{font-size:18px;font-weight:900;margin-bottom:4px}
.start-banner-sub{font-size:11px;opacity:.8;font-family:monospace;margin-bottom:12px}
</style>
</head>
<body>

<div class="topbar">
  <div><div class="topbar-title">🥖 <span id="topDriver"></span></div><div class="topbar-sub" id="topDate"></div></div>
  <div class="topbar-right">
    <button class="lang-tog" id="langTog" onclick="toggleLang()">मर</button>
    <button class="logout" onclick="logout()">Logout</button>
  </div>
</div>

<div class="tabs">
  <button class="tab on" id="tb-orders" onclick="showTab('orders')"><span id="t-orders">📋 Orders</span></button>
  <button class="tab" id="tb-route" onclick="showTab('route')"><span id="t-route">🗺 Route</span></button>
  <button class="tab" id="tb-gps" onclick="showTab('gps')"><span id="t-gps">📍 GPS</span></button>
</div>

<!-- ── ORDERS ── -->
<div class="page on" id="pg-orders">
  <!-- Date picker -->
  <div class="card" style="margin-bottom:8px;display:flex;align-items:center;gap:10px">
    <div style="flex:1">
      <div class="lbl" id="t-selectDate">Select Date</div>
      <input type="date" id="orderDate" onchange="loadOrdersForDate(this.value)">
    </div>
    <button onclick="loadOrdersForDate(document.getElementById('orderDate').value)"
      style="background:#f5ede0;border:1.5px solid #e8dfd2;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;color:#4a2f14;font-family:-apple-system,sans-serif;white-space:nowrap;flex-shrink:0">
      ↻ <span id="t-refresh">Load</span>
    </button>
  </div>
  <!-- Product summary -->
  <div id="orderSummaryCard" class="card" style="display:none;margin-bottom:8px">
    <div class="lbl" id="t-prodSummary">Product Summary</div>
    <div id="orderSummaryBody"></div>
  </div>
  <div id="ordersList"></div>
</div>

<!-- ── ROUTE ── -->
<div class="page" id="pg-route">
  <!-- Start Route Banner -->
  <div id="startBanner" class="start-banner">
    <div class="start-banner-title" id="t-startTitle">Ready to deliver?</div>
    <div class="start-banner-sub" id="t-startSub">Tap below to begin your route for today</div>
    <button class="btn btn-start" id="startBtn" onclick="startRoute()">🚀 Start Route</button>
  </div>

  <div id="routeSummaryCard" class="route-summary-card" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
      <div style="font-size:14px;font-weight:900;color:#2d7a4f" id="rs-progress-label">0 / 0 Shops</div>
      <div style="font-size:10px;font-family:monospace;color:#8a7a6a" id="rs-start-info"></div>
    </div>
    <div class="progress-wrap"><div class="progress-fill" id="rs-progress-bar" style="width:0%"></div></div>
    <div class="stat-row">
      <div class="stat" id="rs-all-stat" onclick="setRouteFilter('all')" style="cursor:pointer"><div class="stat-n" id="rs-all">0</div><div class="stat-l">All</div></div>
      <div class="stat" id="rs-done-stat" onclick="setRouteFilter('done')" style="cursor:pointer"><div class="stat-n" id="rs-done">0</div><div class="stat-l" id="t-done">Done</div></div>
      <div class="stat" id="rs-pending-stat" onclick="setRouteFilter('pending')" style="cursor:pointer"><div class="stat-n" id="rs-pending">0</div><div class="stat-l" id="t-pending">Pending</div></div>
      <div class="stat"><div class="stat-n" id="rs-km">0</div><div class="stat-l">KM</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button onclick="shuffleRoute()" style="flex:1;padding:9px;border:none;border-radius:10px;background:#1a5fa8;color:#fff;font-size:12px;font-weight:800;cursor:pointer;font-family:-apple-system,sans-serif">🔀 Shuffle Stops</button>
      <button onclick="resetRoute()" id="resetRouteBtn" style="flex:0 0 90px;padding:9px;border:none;border-radius:10px;background:#e8dfd2;color:#4a2f14;font-size:12px;font-weight:800;cursor:pointer;font-family:-apple-system,sans-serif;display:none">↩ Reset</button>
    </div>
  </div>
  <div id="routeStats" style="display:none"></div>

  <div id="route-msg" style="display:none" class="msg in"></div>
  <div id="mapBtnWrap" style="display:none;margin-bottom:10px"></div>
  <div id="routeBody"></div>
</div>

<!-- ── GPS ── -->
<div class="page" id="pg-gps">
  <div class="card">
    <div class="lbl" id="t-searchLbl">Search Customer</div>
    <input type="text" id="srch" oninput="filterCustomers()">
  </div>
  <div id="gps-msg" style="display:none" class="msg ok"></div>
  <div id="selBox" style="display:none" class="card">
    <div class="lbl">Selected</div>
    <div id="selName" style="font-size:15px;font-weight:800;color:#4a2f14"></div>
    <div id="selArea" style="font-size:11px;color:#8a7a6a;font-family:monospace;margin-top:3px"></div>
    <div id="selStatus" style="font-size:11px;font-weight:700;font-family:monospace;margin-top:6px;color:#1565c0"></div>
  </div>
  <button class="btn btn-gps" id="gpsBtn" onclick="doGPS()">📍 <span id="t-captureBtn">Capture My Location</span></button>
  <button class="btn btn-save" id="saveBtn" onclick="doSave()" style="display:none">✅ <span id="t-saveBtn">Confirm & Save</span></button>
  <div class="card">
    <div class="lbl" id="t-myCustomers">My Customers</div>
    <div class="shop-list" id="customerList"><div style="padding:10px;font-size:12px;color:#8a7a6a;font-family:monospace" id="t-loadingCustomers">Loading…</div></div>
  </div>
</div>

<script>
const driver = sessionStorage.getItem('driver');
if (!sessionStorage.getItem('role') || !driver) window.location.href='/';

const HQ = CONFIG.HQ;
const L  = CONFIG.LANG;
let lang  = sessionStorage.getItem('lang') || localStorage.getItem('lang') || 'en';

function t(key) { return (L[lang]||L.en)[key] || key; }

function applyLang() {
  document.getElementById('langTog').textContent = lang==='mr' ? 'EN' : 'मर';
  document.getElementById('t-orders').textContent = lang==='mr' ? '📋 ऑर्डर' : '📋 Orders';
  document.getElementById('t-route').textContent  = lang==='mr' ? '🗺 मार्ग'  : '🗺 Route';
  document.getElementById('t-gps').textContent    = lang==='mr' ? '📍 GPS'   : '📍 GPS';
  document.getElementById('t-startTitle').textContent = lang==='mr' ? 'डिलिव्हरी सुरू करायची?' : 'Ready to deliver?';
  document.getElementById('t-startSub').textContent   = lang==='mr' ? 'आजच्या मार्गासाठी खाली टॅप करा' : 'Tap below to begin your route for today';
  document.getElementById('startBtn').textContent     = t('startRoute');
  document.getElementById('t-done').textContent    = lang==='mr' ? 'झाले' : 'Done';
  document.getElementById('t-pending').textContent = lang==='mr' ? 'बाकी' : 'Pending';
  document.getElementById('t-selectDate').textContent  = lang==='mr' ? 'तारीख निवडा' : 'Select Date';
  document.getElementById('t-refresh').textContent     = lang==='mr' ? 'लोड' : 'Load';
  document.getElementById('t-prodSummary').textContent = lang==='mr' ? 'वस्तू एकूण' : 'Product Summary';
  document.getElementById('t-searchLbl').textContent   = lang==='mr' ? 'ग्राहक शोधा' : 'Search Customer';
  document.getElementById('srch').placeholder         = lang==='mr' ? 'नाव किंवा क्षेत्र…' : 'Search by name or area…';
  document.getElementById('t-captureBtn').textContent = lang==='mr' ? 'माझे स्थान घ्या' : 'Capture My Location';
  document.getElementById('t-saveBtn').textContent    = lang==='mr' ? 'जतन करा' : 'Confirm & Save';
  document.getElementById('t-myCustomers').textContent    = lang==='mr' ? 'माझे ग्राहक' : 'My Customers';
}

function toggleLang() {
  lang = lang==='en' ? 'mr' : 'en';
  sessionStorage.setItem('lang', lang);
  localStorage.setItem('lang', lang);
  applyLang();
  renderOrdersList();
  if (routeStarted) buildRouteUI();
}

function logout() { sessionStorage.clear(); window.location.href='/'; }

document.getElementById('topDriver').textContent = driver;
document.getElementById('topDate').textContent = todayStr();

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// ── TABS ──
function showTab(tab) {
  ['orders','route','gps'].forEach(x=>{
    document.getElementById('pg-'+x).classList.toggle('on',x===tab);
    document.getElementById('tb-'+x).classList.toggle('on',x===tab);
  });
  if(tab==='route') buildRouteUI();
}

// ── STATE ──
let allCustomers=[], selCustomer=null, captured=null;
let orders=[], deliveries={}, routeStarted=false, routeStartTime=null;
let routeStartLat=null, routeStartLng=null;
let selectedDate = '';
let customRoute = null; // null = auto-optimized, array = custom shuffled order
let routeFilter = 'all'; // 'all' | 'done' | 'pending'

// ── LOAD ──
async function init() {
  applyLang();
  selectedDate = todayStr();
  document.getElementById('orderDate').value = selectedDate;
  const [shopsData, ordersData, delivData] = await Promise.all([
    api({action:'getShops', driver}),
    api({action:'getOrders', driver, date:selectedDate}),
    api({action:'getDeliveries', driver, date:selectedDate})
  ]);
  allCustomers = Array.isArray(shopsData) ? shopsData : [];
  orders = Array.isArray(ordersData) ? ordersData : [];
  deliveries = {};
  if(Array.isArray(delivData)) delivData.forEach(d=>{ deliveries[d.shop_id]=d; });
  // check if route already started today
  const savedStart = localStorage.getItem('routeStart_'+driver+'_'+selectedDate);
  if(savedStart){
    routeStarted=true; routeStartTime=savedStart;
    routeStartLat = parseFloat(localStorage.getItem('routeStartLat_'+driver+'_'+selectedDate)) || null;
    routeStartLng = parseFloat(localStorage.getItem('routeStartLng_'+driver+'_'+selectedDate)) || null;
  }
  renderOrdersList();
  renderCustomerList(allCustomers);
}

// ── LOAD ORDERS FOR DATE ──
async function loadOrdersForDate(date) {
  if(!date) return;
  selectedDate = date;
  const el = document.getElementById('ordersList');
  el.innerHTML = `<div style="text-align:center;padding:24px;font-size:12px;color:#8a7a6a;font-family:monospace">Loading…</div>`;
  document.getElementById('orderSummaryCard').style.display = 'none';
  const [ordersData, delivData] = await Promise.all([
    api({action:'getOrders', driver, date:selectedDate}),
    api({action:'getDeliveries', driver, date:selectedDate})
  ]);
  orders = Array.isArray(ordersData) ? ordersData : [];
  deliveries = {};
  if(Array.isArray(delivData)) delivData.forEach(d=>{ deliveries[d.shop_id]=d; });
  // Restore route state for this date
  const savedStart = localStorage.getItem('routeStart_'+driver+'_'+selectedDate);
  routeStarted = !!savedStart;
  routeStartTime = savedStart || null;
  routeStartLat = parseFloat(localStorage.getItem('routeStartLat_'+driver+'_'+selectedDate)) || null;
  routeStartLng = parseFloat(localStorage.getItem('routeStartLng_'+driver+'_'+selectedDate)) || null;
  renderOrdersList();
  // Rebuild route if route tab is active
  if(document.getElementById('pg-route').classList.contains('on')) buildRouteUI();
}

// ── ORDERS ──
function renderOrdersList() {
  const el = document.getElementById('ordersList');
  if(!orders.length){
    document.getElementById('orderSummaryCard').style.display='none';
    el.innerHTML=`<div style="text-align:center;padding:40px;font-size:13px;color:#8a7a6a;font-family:monospace">${t('noOrders')}</div>`;
    return;
  }
  // ── Product summary with category grouping ──
  const totals={};
  orders.forEach(o=>{
    const its=(o.items||'').split(',').map(s=>s.replace(/\s*\(.*?\)/g,'').trim()).filter(Boolean);
    const qs=(o.qty||'').split(',').map(s=>parseInt(s)||0);
    its.forEach((it,i)=>{ totals[it]=(totals[it]||0)+(qs[i]||0); });
  });
  // Category keyword grouping
  function drvGetCat(name){
    const n=(name||'').toLowerCase();
    if(/puff/.test(n))            return 'Puff';
    if(/sweet[\s-]?bun/.test(n)) return 'Sweet Bun';
    if(/white[\s-]?bun/.test(n)) return 'White Bun';
    if(/bun/.test(n))             return 'Bun';
    if(/bread/.test(n))           return 'Bread';
    if(/cake/.test(n))            return 'Cake';
    if(/toast/.test(n))           return 'Toast';
    if(/rusk/.test(n))            return 'Rusk';
    if(/cookie|biscuit/.test(n)) return 'Cookie';
    return 'Other';
  }
  // Group totals by category
  const cats={};
  Object.entries(totals).forEach(([name,qty])=>{
    const cat=drvGetCat(name);
    if(!cats[cat]) cats[cat]={total:0,items:[]};
    cats[cat].total+=qty;
    cats[cat].items.push({name,qty});
  });
  const catEntries=Object.entries(cats).sort((a,b)=>b[1].total-a[1].total);
  const grandTotal=Object.values(totals).reduce((s,v)=>s+v,0);
  const doneCount=Object.values(deliveries).length;

  document.getElementById('orderSummaryBody').innerHTML=
    // Stats bar
    `<div style="display:flex;gap:6px;margin-bottom:10px">
      <div style="flex:1;background:#fff8f0;border:1.5px solid #e8c87a;border-radius:8px;padding:6px 4px;text-align:center">
        <div style="font-size:20px;font-weight:900;color:#4a2f14;line-height:1">${orders.length}</div>
        <div style="font-size:9px;color:#8a7a6a;font-family:monospace;margin-top:1px">${lang==='mr'?'दुकाने':'shops'}</div>
      </div>
      <div style="flex:1;background:#f0f8f0;border:1.5px solid #8ac87a;border-radius:8px;padding:6px 4px;text-align:center">
        <div style="font-size:20px;font-weight:900;color:#2d7a4f;line-height:1">${grandTotal}</div>
        <div style="font-size:9px;color:#8a7a6a;font-family:monospace;margin-top:1px">${lang==='mr'?'एकूण':'items'}</div>
      </div>
      <div style="flex:1;background:#f0f8ff;border:1.5px solid #7ab8e8;border-radius:8px;padding:6px 4px;text-align:center">
        <div style="font-size:20px;font-weight:900;color:#1565c0;line-height:1">${doneCount}</div>
        <div style="font-size:9px;color:#8a7a6a;font-family:monospace;margin-top:1px">${lang==='mr'?'झाले':'done'}</div>
      </div>
      <div style="flex:1;background:#fff8f8;border:1.5px solid #e87a7a;border-radius:8px;padding:6px 4px;text-align:center">
        <div style="font-size:20px;font-weight:900;color:#c8382a;line-height:1">${orders.length-doneCount}</div>
        <div style="font-size:9px;color:#8a7a6a;font-family:monospace;margin-top:1px">${lang==='mr'?'बाकी':'left'}</div>
      </div>
    </div>`+
    // Category rows
    catEntries.map(([cat,info])=>
      `<div style="background:#fffaf4;border:1.5px solid #e8dfd2;border-radius:8px;padding:7px 10px;margin-bottom:5px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">
          <span style="font-size:12px;font-weight:900;color:#4a2f14;text-transform:uppercase;letter-spacing:.5px">${cat}</span>
          <span style="background:#c8a87a;color:#fff;border-radius:20px;padding:1px 11px;font-size:14px;font-weight:900;font-family:monospace">${info.total}</span>
        </div>
        <div style="padding-left:4px">`+

// ── ROUTE ──
function dist(a,b){ const dl=a.lat-b.lat,dn=a.lng-b.lng; return Math.sqrt(dl*dl+dn*dn); }
function distKm(a,b){
  const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function nearestNeighbour(start,pts){
  let rem=[...pts],route=[],cur={lat:start.lat,lng:start.lng};
  while(rem.length){ let best=null,bd=Infinity; rem.forEach(p=>{const d=dist(cur,p);if(d<bd){bd=d;best=p;}}); route.push(best); rem.splice(rem.indexOf(best),1); cur=best; }
  return route;
}

async function startRoute() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = lang==='mr' ? '📡 स्थान मिळत आहे…' : '📡 Getting location…';

  // Try to capture GPS location at route start
  try {
    if (navigator.geolocation) {
      const pos = await new Promise(function(resolve, reject){
        navigator.geolocation.getCurrentPosition(resolve, reject,
          {enableHighAccuracy:true, timeout:12000, maximumAge:0});
      });
      routeStartLat = parseFloat(pos.coords.latitude.toFixed(6));
      routeStartLng = parseFloat(pos.coords.longitude.toFixed(6));
      localStorage.setItem('routeStartLat_'+driver+'_'+todayStr(), routeStartLat);
      localStorage.setItem('routeStartLng_'+driver+'_'+todayStr(), routeStartLng);
    }
  } catch(e) {
    // GPS unavailable — proceed without location
    routeStartLat = null; routeStartLng = null;
  }

  routeStarted = true;
  routeStartTime = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  localStorage.setItem('routeStart_'+driver+'_'+todayStr(), routeStartTime);

  const saveBody = {action:'saveRouteStart', driver, date:todayStr(), startTime:routeStartTime};
  if (routeStartLat) { saveBody.lat = routeStartLat; saveBody.lng = routeStartLng; }
  await apiPost(saveBody);
  buildRouteUI();
}

function setRouteFilter(f) { routeFilter=f; buildRouteUI(); }

function shuffleRoute() {
  const orderedShopIds = new Set(orders.map(o=>o.shop_id));
  const orderedCustomers = allCustomers.filter(s=>orderedShopIds.has(s.shop_id));
  const withGPS = orderedCustomers.filter(s=>s.lat&&s.lng).map(s=>({...s,lat:parseFloat(s.lat),lng:parseFloat(s.lng)}));
  const pending = withGPS.filter(s=>!deliveries[s.shop_id]);
  // Fisher-Yates shuffle
  for(let i=pending.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pending[i],pending[j]]=[pending[j],pending[i]];
  }
  customRoute = pending;
  const btn=document.getElementById('resetRouteBtn');
  if(btn) btn.style.display='';
  buildRouteUI();
}

function resetRoute() {
  customRoute = null;
  const btn=document.getElementById('resetRouteBtn');
  if(btn) btn.style.display='none';
  buildRouteUI();
}

async function buildRouteUI() {
  const rmsg=document.getElementById('route-msg');
  const body=document.getElementById('routeBody');
  const mapWrap=document.getElementById('mapBtnWrap');
  rmsg.style.display='none'; body.innerHTML='';

  // Show start banner or summary card
  document.getElementById('startBanner').style.display    = routeStarted ? 'none' : 'block';
  document.getElementById('routeSummaryCard').style.display = routeStarted ? 'block' : 'none';
  document.getElementById('routeStats').style.display       = 'none';
  if(!routeStarted) return;

  // Only customers who have orders for today AND are assigned to this driver
  const orderedShopIds = new Set(orders.map(o=>o.shop_id));
  const orderedCustomers = allCustomers.filter(s=>orderedShopIds.has(s.shop_id));

  const withGPS = orderedCustomers.filter(s=>s.lat&&s.lng).map(s=>({...s,lat:parseFloat(s.lat),lng:parseFloat(s.lng)}));
  const noGPS   = orderedCustomers.filter(s=>!s.lat||!s.lng);

  if(!orderedCustomers.length){
    rmsg.textContent=lang==='mr'?'आजचे ऑर्डर नाहीत.':'No orders for today.';
    rmsg.className='msg er'; rmsg.style.display='block'; return;
  }

  // Separate done vs pending (GPS shops)
  const pending    = withGPS.filter(s=>!deliveries[s.shop_id]);
  const done       = withGPS.filter(s=>!!deliveries[s.shop_id]);
  const noGPSpend  = noGPS.filter(s=>!deliveries[s.shop_id]);
  const noGPSdone  = noGPS.filter(s=>!!deliveries[s.shop_id]);
  const totalDone    = done.length + noGPSdone.length;
  const totalPending = pending.length + noGPSpend.length;
  const totalAll     = totalDone + totalPending;

  // Build optimised route from pending GPS shops (or custom shuffled order)
  // Always restrict to ordered shops — customRoute may have stale shops from previous days
  const route = customRoute
    ? customRoute.filter(s=>!deliveries[s.shop_id] && orderedShopIds.has(s.shop_id))
    : nearestNeighbour(HQ, pending);

  // Calc km from pending GPS route
  let totalKm=0,prev=HQ;
  route.forEach(s=>{totalKm+=distKm(prev,s);prev=s;});
  totalKm=Math.round(totalKm);
  const mins=Math.round(totalKm/25*60+route.length*5);
  const estH=Math.floor(mins/60),estM=mins%60;

  // Update stats
  document.getElementById('rs-all').textContent=totalAll;
  document.getElementById('rs-done').textContent=totalDone;
  document.getElementById('rs-pending').textContent=totalPending;
  document.getElementById('rs-km').textContent=totalKm;

  // Highlight active filter
  ['all','done','pending'].forEach(f=>{
    var el=document.getElementById('rs-'+f+'-stat');
    if(el){el.style.background=routeFilter===f?'#e8f5e9':'rgba(255,255,255,.7)';el.style.borderColor=routeFilter===f?'#2d7a4f':'#e8dfd2';}
  });

  // Progress bar
  var pct=totalAll>0?Math.round(totalDone/totalAll*100):0;
  var pb=document.getElementById('rs-progress-bar');
  var pl=document.getElementById('rs-progress-label');
  var si=document.getElementById('rs-start-info');
  if(pb) pb.style.width=pct+'%';
  if(pl) pl.textContent=totalDone+' / '+totalAll+' '+(lang==='mr'?'दुकाने':'Shops')+' ('+pct+'%)';
  if(si) si.textContent=(lang==='mr'?'सुरुवात':'Started')+': '+routeStartTime+(routeStartLat?' 📍':'')+' · '+estH+'h '+estM+'m';

  // Map button — pending GPS stops only
  const pendingCoords=route.map(s=>s.lat+','+s.lng);
  const mapsUrl=pendingCoords.length
    ? 'https://www.google.com/maps/dir/My+Location/'+pendingCoords.join('/')
    : '';
  mapWrap.style.display=mapsUrl?'block':'none';
  if(mapsUrl) mapWrap.innerHTML=`<a href="${mapsUrl}" target="_blank" style="display:block;background:#2d7a4f;color:#fff;padding:13px;border-radius:14px;text-align:center;font-weight:800;font-size:14px;text-decoration:none">${t('routeStart')} (${pending.length} ${lang==='mr'?'दुकाने':'stops'})</a>`;

  // Helper: convert "HH:MM AM/PM" to minutes for sorting
  function timeToMins(t){
    if(!t) return 9999;
    const m=t.match(/(\d+):(\d+)\s*(AM|PM|am|pm)?/);
    if(!m) return 9999;
    let h=parseInt(m[1]),mn=parseInt(m[2]),p=(m[3]||'').toUpperCase();
    if(p==='PM'&&h!==12) h+=12;
    if(p==='AM'&&h===12) h=0;
    return h*60+mn;
  }

  // Sort done shops by delivery time ascending (first delivered = first in list)
  const doneSorted=[...done].sort((a,b)=>timeToMins(deliveries[a.shop_id]?.time)-timeToMins(deliveries[b.shop_id]?.time));
  const noGPSdoneSorted=[...noGPSdone].sort((a,b)=>timeToMins(deliveries[a.shop_id]?.time)-timeToMins(deliveries[b.shop_id]?.time));

  // ── Determine what to display based on filter ──
  // Done (asc by time) shown first so you can read delivery sequence top-to-bottom
  let displayGPS;
  if(routeFilter==='done')         displayGPS = doneSorted;
  else if(routeFilter==='pending') displayGPS = route;
  else                             displayGPS = [...doneSorted, ...route];

  let displayNoGPS;
  if(routeFilter==='done')         displayNoGPS = noGPSdoneSorted;
  else if(routeFilter==='pending') displayNoGPS = noGPSpend;
  else                             displayNoGPS = [...noGPSdoneSorted, ...noGPSpend];

  // ── Route list ──
  let html='';
  html+=`<div class="route-stop"><div class="rnum" style="background:#4a2f14;font-size:10px">HQ</div><div class="rinfo"><div class="rname">🥖 ${HQ.name}</div><div class="rmeta">${lang==='mr'?'सुरुवात':'START'} · ${routeStartTime}</div></div></div>`;

  let stopNum=0;
  displayGPS.forEach((s,i)=>{
    const isDone=!!deliveries[s.shop_id];
    const stopLabel=isDone?(i+1):(++stopNum); // done: position in time order; pending: upcoming stop number
    const shopOrders=orders.filter(o=>o.shop_id===s.shop_id);
    html+=`<div class="rline"></div>
    <div class="route-stop">
      <div class="rnum ${isDone?'done':''}">${isDone?stopLabel:stopLabel}</div>
      <div class="rinfo ${isDone?'done':''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div class="rname">${s.name}</div>
          <span class="badge ${isDone?'b-done':'b-warn'}">${isDone?('✅ '+deliveries[s.shop_id]?.time):t('pending')}</span>
        </div>
        <div class="rmeta">${s.area||''}</div>
        ${shopOrders.length?`<div style="font-size:11px;font-family:monospace;color:#4a2f14;margin-top:4px">${shopOrders.map(o=>o.items+' · '+o.qty).join('<br>')}</div>`:''}
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
          <a href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank" class="btn-sm btn-map" style="text-decoration:none;padding:7px 12px;background:#e3f2fd;color:#1565c0;border-radius:10px;font-size:11px;font-weight:700">🗺 Map</a>
          ${!isDone?`<button class="btn-sm btn-deliver" onclick="markDelivered('${s.shop_id}','${s.name.replace(/'/g,"\\'")}')">${t('markDelivered')}</button>`:''}
        </div>
      </div>
    </div>`;
  });

  // noGPS shops — shown with warning style, still mark-deliverable
  displayNoGPS.forEach((s,i)=>{
    const isDone=!!deliveries[s.shop_id];
    const noGpsLabel=isDone?(doneSorted.length+i+1):(++stopNum);
    const shopOrders=orders.filter(o=>o.shop_id===s.shop_id);
    html+=`<div class="rline"></div>
    <div class="route-stop">
      <div class="rnum" style="background:${isDone?'#8a7a6a':'#e67e22'};font-size:10px">${isDone?noGpsLabel:'⚠'}</div>
      <div class="rinfo" style="border-color:${isDone?'#e8dfd2':'#ffe082'};background:${isDone?'#f5f5f5':'#fffbf0'};${isDone?'opacity:.6':''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div class="rname">${s.name}</div>
          <span class="badge ${isDone?'b-done':'b-warn'}">${isDone?('✅ '+deliveries[s.shop_id]?.time):t('pending')}</span>
        </div>
        <div class="rmeta">${s.area||''}</div>
        ${shopOrders.length?`<div style="font-size:11px;font-family:monospace;color:#4a2f14;margin-top:4px">${shopOrders.map(o=>o.items+' · '+o.qty).join('<br>')}</div>`:''}
        ${!isDone?`<div style="font-size:10px;color:#7a4800;font-family:monospace;margin-top:4px">⚠ ${lang==='mr'?'GPS नाही — GPS टॅबमध्ये स्थान जोडा':'No GPS location — add via GPS tab'}</div>`:''}
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
          ${!isDone?`<button class="btn-sm btn-deliver" onclick="markDelivered('${s.shop_id}','${s.name.replace(/'/g,"\\'")}')">${t('markDelivered')}</button>`:''}
        </div>
      </div>
    </div>`;
  });

  body.innerHTML=html;
  // Save route stats
  apiPost({action:'saveRoute',date:todayStr(),driver,shop_order:JSON.stringify(route.map(s=>s.name)),total_shops:totalAll,total_km:totalKm,est_time:estH+'h '+estM+'m'});
}

async function markDelivered(shopId, shopName) {
  const time=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  deliveries[shopId]={shop_id:shopId,time};
  const body={action:'markDelivered',driver,shop_id:shopId,shop_name:shopName,date:selectedDate||todayStr(),time};
  // Silently capture delivery location
  try {
    if(navigator.geolocation){
      const pos=await new Promise(function(resolve,reject){
        navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:8000,maximumAge:30000});
      });
      body.lat=parseFloat(pos.coords.latitude.toFixed(6));
      body.lng=parseFloat(pos.coords.longitude.toFixed(6));
    }
  } catch(e){ /* GPS unavailable — save without location */ }
  await apiPost(body);
  buildRouteUI();
  renderOrdersList();
  // Check if ALL shops for today are now done → open WhatsApp group
  const orderedIds = new Set(orders.map(o=>o.shop_id));
  const allDone = [...orderedIds].every(id=>!!deliveries[id]);
  if(allDone && orderedIds.size > 0 && CONFIG.WHATSAPP_GROUP){
    const msg = `✅ All deliveries done!\nDriver: ${driver}\nDate: ${selectedDate||todayStr()}\nTotal shops: ${orderedIds.size}\nTime: ${new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}`;
    if(confirm(`🎉 All ${orderedIds.size} deliveries complete!\n\nOpen WhatsApp group to send update?`)){
      window.open(CONFIG.WHATSAPP_GROUP + '?text=' + encodeURIComponent(msg));
    }
  }
}

// ── GPS CAPTURE ──
function filterCustomers(){ renderCustomerList(allCustomers.filter(s=>(s.name+' '+(s.area||'')).toLowerCase().includes(document.getElementById('srch').value.toLowerCase()))); }

function renderCustomerList(list) {
  const el=document.getElementById('customerList');
  if(!list.length){ el.innerHTML=`<div style="padding:10px;font-size:12px;color:#8a7a6a;font-family:monospace">${lang==='mr'?'ग्राहक सापडला नाही':'No customers found.'}</div>`; return; }
  el.innerHTML=list.map(s=>`
    <div class="si ${selCustomer?.shop_id==s.shop_id?'on':''} ${s.lat?'gps-saved':''}" onclick="pickShop('${s.shop_id}')">
      <div style="flex:1"><div class="si-n">${s.name}</div><div class="si-a">${s.area||''}</div></div>
      <div style="font-size:11px;font-weight:700;color:${s.lat?'#2d7a4f':'#c8382a'}">${s.lat?'✅':'⚠'}</div>
    </div>`).join('');
}

function pickShop(id){
  selCustomer=allCustomers.find(s=>s.shop_id==id); captured=null;
  document.getElementById('saveBtn').style.display='none';
  document.getElementById('gps-msg').style.display='none';
  document.getElementById('selName').textContent=selCustomer.name;
  document.getElementById('selArea').textContent='📍 '+(selCustomer.area||'');
  document.getElementById('selStatus').textContent=selCustomer.lat?`GPS: ${selCustomer.lat}, ${selCustomer.lng}`:(lang==='mr'?'GPS नाही — खाली घ्या':'No GPS — capture below');
  document.getElementById('selBox').style.display='block';
  renderCustomerList(allCustomers);
  document.getElementById('selBox').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function gMsg(txt,type){ const el=document.getElementById('gps-msg'); el.textContent=txt; el.className='msg '+type; el.style.display='block'; }

function doGPS(){
  if(!selCustomer){ gMsg(lang==='mr'?'प्रथम ग्राहक निवडा':'Select a customer first','er'); return; }
  if(!navigator.geolocation){ gMsg('GPS not available.','er'); return; }
  const btn=document.getElementById('gpsBtn'); btn.disabled=true;
  btn.innerHTML=`⏳ ${lang==='mr'?'स्थान मिळत आहे…':'Getting location…'}`;
  gMsg(lang==='mr'?'📡 GPS सुरू आहे…':'📡 Getting your location…','in');
  navigator.geolocation.getCurrentPosition(pos=>{
    captured={lat:parseFloat(pos.coords.latitude.toFixed(6)),lng:parseFloat(pos.coords.longitude.toFixed(6)),acc:Math.round(pos.coords.accuracy)};
    gMsg(`📍 ${lang==='mr'?'स्थान मिळाले':'Location found'}!\nLat: ${captured.lat}\nLng: ${captured.lng}\n±${captured.acc}m`,'ok');
    document.getElementById('saveBtn').style.display='block';
    btn.innerHTML=`📍 ${t('captureLocation')}`; btn.disabled=false;
    document.getElementById('saveBtn').scrollIntoView({behavior:'smooth',block:'nearest'});
  },err=>{
    btn.innerHTML=`📍 ${t('captureLocation')}`; btn.disabled=false;
    if(err.code===1) gMsg(lang==='mr'?'❌ परवानगी नाकारली!\nSettings → Location → Allow':'❌ Permission denied!\nSettings → Location → Allow','er');
    else gMsg(lang==='mr'?'❌ GPS मिळाले नाही. बाहेर जा आणि पुन्हा प्रयत्न करा.':'❌ GPS failed. Step outside and try again.','er');
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}

async function doSave(){
  if(!captured||!selCustomer) return;
  const btn=document.getElementById('saveBtn'); btn.textContent=lang==='mr'?'जतन होत आहे…':'Saving…'; btn.disabled=true;
  const res=await apiPost({action:'saveGPS',shop_id:selCustomer?.shop_id,lat:captured.lat,lng:captured.lng,driver});
  if(res.ok){
    selCustomer.lat=captured.lat; selCustomer.lng=captured.lng;
    gMsg(`✅ ${lang==='mr'?'जतन झाले':'Saved'}!\n${selCustomer.name}\n${captured.lat}, ${captured.lng}`,'ok');
    document.getElementById('selStatus').textContent=`✅ ${captured.lat}, ${captured.lng}`;
    captured=null; renderCustomerList(allCustomers);
  } else {
    gMsg('❌ Save failed: '+(res.error||'unknown'),'er');
  }
  btn.innerHTML=`✅ ${t('confirmSave')}`; btn.disabled=false; btn.style.display='none';
}

init();
</script>
</body>
</html>
